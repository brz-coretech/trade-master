<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden rounded-lg bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2 text-sm shadow-lg"></div>

<script>
/* =====================================================================
   TRADEMASTER — Application encyclopédique & d'entraînement
   Commerce international, douane, logistique, finance export, droit.
   Fichier unique : HTML + CSS + JS. Données en localStorage.
   Plan du script :
     1. Utilitaires        2. Persistance (état)     3. CONTENU (piliers, encyclopédie,
     flashcards, QCM/cas)  4. Moteur d'activité/streak  5. Vues (dashboard, encyclopédie,
     flashcards, outils, studio, données)  6. Initialisation
   ===================================================================== */

/* ------------------ 0. CONFIGURATION DE MARQUE (à personnaliser) ------------------ */
const CFG = {
  name: 'Trade Master',                                   // nom affiché dans l'application
  tagline: 'Commerce international',                     // sous-titre de la barre latérale
  author: 'EduTech Lab',                                          // ex. 'Votre Nom / Votre marque' (affiché en pied de page si renseigné)
  contact: '',                                           // ex. 'support@votre-domaine.com' (affiché si renseigné)
  version: '1.0.0',
  licence: 'Licence d\'utilisation personnelle — toute redistribution ou revente est interdite sans autorisation.'
};

/* ---------------------------- 1. UTILITAIRES ---------------------------- */
const $  = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const todayStr = () => new Date().toLocaleDateString('en-CA');            // AAAA-MM-JJ (heure locale)
function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } // Fisher-Yates
const fmt = (n, d = 2) => (isFinite(n) ? n : 0).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2600); }

/* --------------------------- 2. PERSISTANCE --------------------------- */
const LS_KEY = 'tradeMaster.v1';
function defaults() {
  return {
    theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark',
    onboarded: false,                  // écran d'accueil déjà vu ?
    lastExport: null,                  // date de la dernière sauvegarde JSON
    goal: { cards: 20, cases: 1 },     // objectifs quotidiens
    cards: {},                         // état Leitner par carte : {due,last,reps,lapses}
    custom: [],                        // cartes créées par l'utilisateur
    hidden: [],                        // cartes d'origine supprimées
    edits: {},                         // cartes d'origine modifiées
    days: {},                          // historique : 'AAAA-MM-JJ' -> {cards,cases,qcm,ok,tot,read}
    streak: 0, best: 0, lastDate: null,
    seenQ: [],                         // anti-répétition des questions
    qstats: {},                        // par pilier : {ok,tot}
    exams: [],                         // historique des examens
    nextId: 1,
    xp: 0,                              // points d'expérience (gamification)
    badges: [],                        // badges débloqués (ids)
    flags: {},                         // petits indicateurs divers (outils utilisés, etc.)
    nego: {},                          // progression du simulateur de négociation, par scénario
    crisis: null,                      // progression du scénario crise multi-pilier
    subqstats: {}                      // stats fines par pilier+sous-thème : {ok,tot}
  };
}
function load() {
  try { const r = JSON.parse(localStorage.getItem(LS_KEY)); const d = Object.assign(defaults(), r || {}); d.goal = Object.assign({ cards: 20, cases: 1 }, d.goal); return d; }
  catch (e) { return defaults(); }
}
let S = load();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('Stockage local indisponible : pensez à exporter vos données.'); } }

/* ------------------------ 3. CONTENU PÉDAGOGIQUE ------------------------ */
const PN = {
  1: { n: 'Incoterms 2020',               short: 'Incoterms',  c: '#6366f1' },
  2: { n: 'Finance & Paiements',          short: 'Finance',    c: '#10b981' },
  3: { n: 'Transport, Logistique & Douane', short: 'Douane',   c: '#f59e0b' },
  4: { n: 'Contrats, Droit & Négociation', short: 'Contrats',  c: '#f43f5e' },
  5: { n: 'Démarches Import/Export',      short: 'Démarches',  c: '#0ea5e9' }
};
const pBadge = p => `<span class="inline-block rounded-full px-2 py-0.5 text-[11px] font-semibold" style="background:${PN[p].c}22;color:${PN[p].c}">${PN[p].short}</span>`;

/* ---- 3a. ENCYCLOPÉDIE : une fiche = {id, p(ilier), t(itre), h(tml)} ---- */
const ENC = [
/* ======================= PILIER 1 — INCOTERMS ======================= */
{ id: 'e1', p: 1, t: 'Les 11 règles Incoterms® 2020 — vue d\'ensemble', h: `
<p>Les Incoterms (International Commercial Terms) de la CCI définissent, dans un contrat de vente, <b>qui fait quoi, qui paie quoi et où le risque est transféré</b>. La version 2020 compte 11 règles réparties en deux familles.</p>
<h4>Règles pour tout mode de transport (7)</h4>
<ul><li><b>EXW</b> — Ex Works (À l'usine)</li><li><b>FCA</b> — Free Carrier (Franco transporteur)</li><li><b>CPT</b> — Carriage Paid To (Port payé jusqu'à)</li><li><b>CIP</b> — Carriage and Insurance Paid To (Port payé, assurance incluse)</li><li><b>DAP</b> — Delivered at Place (Rendu au lieu de destination)</li><li><b>DPU</b> — Delivered at Place Unloaded (Rendu lieu de destination déchargé) — <i>remplace DAT de 2010</i></li><li><b>DDP</b> — Delivered Duty Paid (Rendu droits acquittés)</li></ul>
<h4>Règles exclusivement maritimes et fluviales (4)</h4>
<ul><li><b>FAS</b> — Free Alongside Ship (Franco le long du navire)</li><li><b>FOB</b> — Free On Board (Franco bord)</li><li><b>CFR</b> — Cost and Freight (Coût et fret)</li><li><b>CIF</b> — Cost, Insurance and Freight (Coût, assurance et fret)</li></ul>
<div class="key"><b>Changements 2020 :</b> DPU remplace DAT ; assurance CIP portée à la clause (A) « tous risques » (CIF reste en clause (C)) ; B/L « On Board » possible sous FCA ; transport avec ses propres moyens permis sous FCA, DAP, DPU, DDP ; obligations de sûreté explicitées.</div>
<p><b>Rappel capital :</b> les Incoterms ne règlent ni le transfert de propriété, ni le prix et le paiement, ni le droit applicable, ni les conséquences d'une rupture de contrat. Ils se citent avec <b>le lieu précis</b> et la version : « FCA Abidjan, terminal à conteneurs Incoterms® 2020 ».</p>` },

{ id: 'e2', p: 1, t: 'Matrice comparative : frais, risques et formalités', h: `
<table><tr><th>Règle</th><th>Transfert des risques</th><th>Fret principal</th><th>Assurance</th><th>Dédouanement export</th><th>Dédouanement import</th></tr>
<tr><td><b>EXW</b></td><td>Marchandise mise à disposition chez le vendeur</td><td>Acheteur</td><td>Acheteur</td><td>Acheteur</td><td>Acheteur</td></tr>
<tr><td><b>FCA</b></td><td>Remise au transporteur désigné (chargée sur le véhicule de l'acheteur si livraison chez le vendeur)</td><td>Acheteur</td><td>Acheteur</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>CPT</b></td><td>Remise au 1er transporteur</td><td>Vendeur</td><td>Acheteur</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>CIP</b></td><td>Remise au 1er transporteur</td><td>Vendeur</td><td>Vendeur (clause A)</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>DAP</b></td><td>Prête au déchargement au lieu convenu</td><td>Vendeur</td><td>Vendeur (en pratique)</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>DPU</b></td><td>Après déchargement au lieu convenu</td><td>Vendeur</td><td>Vendeur (en pratique)</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>DDP</b></td><td>Prête au déchargement au lieu convenu</td><td>Vendeur</td><td>Vendeur (en pratique)</td><td>Vendeur</td><td>Vendeur</td></tr>
<tr><td><b>FAS</b></td><td>Marchandise le long du navire</td><td>Acheteur</td><td>Acheteur</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>FOB</b></td><td>Marchandise à bord du navire</td><td>Acheteur</td><td>Acheteur</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>CFR</b></td><td>Marchandise à bord (au port d'embarquement)</td><td>Vendeur</td><td>Acheteur</td><td>Vendeur</td><td>Acheteur</td></tr>
<tr><td><b>CIF</b></td><td>Marchandise à bord (au port d'embarquement)</td><td>Vendeur</td><td>Vendeur (clause C)</td><td>Vendeur</td><td>Acheteur</td></tr></table>
<div class="tip"><b>À retenir :</b> pour CPT, CIP, CFR, CIF, DAP, DPU, DDP, le vendeur paie le transport principal, mais <u>le risque est transféré avant</u> (sauf DAP/DPU/DDP). Transfert des risques ≠ transfert des coûts. Le vendeur n'est pas tenu d'assurer sous DAP/DPU/DDP, mais il porte le risque jusqu'à destination : il a tout intérêt à le faire.</div>
<p>L'assurance sous CIF/CIP couvre au minimum <b>110 %</b> du prix du contrat, dans la devise du contrat.</p>` },

{ id: 'e3', p: 1, t: 'Choisir l\'Incoterm selon le mode de transport', h: `
<table><tr><th>Situation</th><th>Incoterms adaptés</th><th>Pourquoi</th></tr>
<tr><td>Conteneur (maritime)</td><td>FCA, CPT, CIP (+ DAP/DPU/DDP)</td><td>Le conteneur est remis au terminal, pas « à bord » : FOB/CFR/CIF laissent le vendeur responsable entre terminal et bord sans contrôle.</td></tr>
<tr><td>Vrac, cargaison classique (breakbulk)</td><td>FAS, FOB, CFR, CIF</td><td>Chargement le long ou à bord du navire, remise réelle au bord.</td></tr>
<tr><td>Aérien</td><td>FCA, CPT, CIP, DAP</td><td>Remise au transporteur ou à l'agent de fret ; « FOB » n'a aucun sens en aérien.</td></tr>
<tr><td>Routier / ferroviaire</td><td>FCA, CPT, CIP, DAP, DPU</td><td>Remise au transporteur (CMR / CIM).</td></tr>
<tr><td>Multimodal</td><td>FCA, CPT, CIP, DAP, DPU, DDP</td><td>Plusieurs transporteurs successifs : seule la famille « tous modes » est cohérente.</td></tr></table>
<p><b>Document de transport associé :</b> maritime → B/L ou sea waybill ; aérien → LTA/AWB ; routier → CMR ; ferroviaire → CIM ; multimodal → FBL / B/L multimodal.</p>` },

{ id: 'e4', p: 1, t: 'Pièges terrain et erreurs fréquentes', h: `
<ul>
<li><b>EXW export :</b> l'acheteur doit dédouaner à l'export — souvent impossible pour un étranger qui n'a pas de statut dans le pays du vendeur. Préférer FCA.</li>
<li><b>FOB/CIF avec conteneur :</b> utilisation inadaptée (voir la fiche « Choisir l\'Incoterm selon le mode de transport »). Passer à FCA/CIP.</li>
<li><b>Lieu imprécis :</b> « FCA Abidjan » ne dit pas où se situent le chargement et le risque. Écrire « FCA Terminal Vridi, Abidjan ».</li>
<li><b>DDP vers un pays à fiscalité complexe :</b> le vendeur doit s'immatriculer à la TVA locale, gérer licences et droits : coûts et risques souvent imprévisibles.</li>
<li><b>CIF = assurance minimale :</b> clause (C) seulement (risques nommés). Si l'acheteur veut du « tous risques », il faut le stipuler ou choisir CIP.</li>
<li><b>Confusion DAP / DPU :</b> sous DAP, le déchargement est à la charge de l'acheteur ; sous DPU, il est à la charge du vendeur.</li>
<li><b>Frais de terminal (THC) :</b> préciser qui supporte le THC à l'origine et à destination dans le contrat de vente.</li>
<li><b>Mélange avec le crédoc :</b> l'Incoterm doit être compatible avec les documents exigés (ex. assurance exigée sous CIF/CIP, B/L « shipped on board »).</li>
<li><b>« Incoterms » sans version :</b> préciser « Incoterms® 2020 » ; les anciennes versions restent utilisables si elles sont citées.</li></ul>` },

{ id: 'e5', p: 1, t: 'Incoterms conseillés vs déconseillés', h: `
<table><tr><th>Position</th><th>Plutôt conseillés</th><th>Plutôt déconseillés</th></tr>
<tr><td><b>Exportateur (vendeur)</b></td><td>FCA (contrôle du chargement et preuve d'export), CPT/CIP (maîtrise du fret), DAP si vous maîtrisez la destination</td><td>EXW (perte de la preuve d'export, TVA), DDP à l'étranger (fiscalité locale), FOB/CIF en conteneur</td></tr>
<tr><td><b>Importateur (acheteur)</b></td><td>FCA/FOB (contrôle du transporteur et du fret), EXW si vous avez un transitaire solide sur place</td><td>CIF/CIP si l'assurance est minimale et le vendeur choisit un fret cher ; DDP si le vendeur est mal équipé (coûts masqués)</td></tr>
<tr><td><b>Débutant</b></td><td>FCA ou CPT/CIP avec lieu précis</td><td>Règles exotiques mal comprises</td></tr></table>
<div class="tip">Le « meilleur » Incoterm dépend de qui maîtrise le mieux le fret, la douane et l'assurance. Chaque partie doit contrôler ce qu'elle sait gérer.</div>` },

/* ======================= PILIER 2 — FINANCE ======================= */
{ id: 'e6', p: 2, t: 'Crédit documentaire — RUU 600 (UCP 600)', h: `
<p>Engagement <b>irrévocable</b> d'une banque (émettrice) de payer le bénéficiaire (exportateur) contre remise de <b>documents conformes</b>, dans les délais du crédit. Il repose sur le principe d'<b>autonomie</b> : on examine les documents, pas la marchandise ni le contrat (art. 4-5).</p>
<h4>Acteurs</h4>
<ul><li><b>Donneur d'ordre</b> : l'importateur ; <b>Banque émettrice</b> ; <b>Banque notificatrice</b> (avise sans engagement) ; <b>Banque confirmatrice</b> (ajoute son engagement) ; <b>Bénéficiaire</b> : l'exportateur.</li></ul>
<h4>Règles clés</h4>
<ul><li>Irrévocable par nature (art. 3).</li><li>Examen par la banque : <b>5 jours ouvrés bancaires</b> maximum (art. 14).</li><li>Présentation des documents : au plus tard <b>21 jours calendaires après l'expédition</b>, et dans la validité du crédit.</li><li>Discordance : refus, ou renonciation (waiver) de l'acheteur ; frais de discordance fréquents.</li></ul>
<h4>Types</h4>
<table><tr><th>Type</th><th>Principe</th></tr>
<tr><td>Notifié</td><td>Seule la banque émettrice s'engage.</td></tr>
<tr><td>Confirmé</td><td>Une 2e banque (souvent dans le pays de l'exportateur) s'engage : couvre risque banque + risque pays.</td></tr>
<tr><td>À vue / à usance</td><td>Paiement à la présentation / à échéance (ex. 90 jours).</td></tr>
<tr><td>Transférable</td><td>Le bénéficiaire peut transférer tout ou partie à un fournisseur (intermédiaires).</td></tr>
<tr><td>Back-to-back</td><td>Second crédit adossé au premier.</td></tr>
<tr><td>Stand-by</td><td>Garantie de paiement, utilisée en cas de défaut (ISP98 ou UCP 600).</td></tr>
<tr><td>Clause rouge / verte</td><td>Avance sur stock ou sur documents de stockage.</td></tr></table>
<div class="tip"><b>Erreurs classiques :</b> noms/adresses incohérents entre documents, date de B/L postérieure à la date limite, description de marchandise différente, assurance insuffisante, documents périmés.</div>` },

{ id: 'e7', p: 2, t: 'Remise documentaire — RDM 522 (URC 522)', h: `
<p>L'exportateur confie les documents à sa banque (<b>banque remettante</b>) qui les transmet à la <b>banque présentatrice</b> du pays de l'importateur. Les banques n'ont aucun engagement de paiement : elles agissent comme intermédiaires.</p>
<table><tr><th>Mode</th><th>Fonctionnement</th></tr>
<tr><td><b>D/P</b> — Documents contre Paiement</td><td>L'acheteur ne reçoit les documents qu'en payant.</td></tr>
<tr><td><b>D/A</b> — Documents contre Acceptation</td><td>L'acheteur accepte une traite à échéance ; il obtient les documents puis paie plus tard (risque d'impayé plus élevé, aval bancaire recommandé).</td></tr></table>
<ul><li>Moins coûteux que le crédoc, mais <b>moins sûr</b> : l'acheteur peut refuser de payer et laisser la marchandise au port.</li><li>Adapté si relation de confiance et risque pays modéré, ou en complément d'une assurance-crédit.</li><li>Risque de marchandise abandonnée → prévoir la remise sous Incoterm adapté et la possibilité de revente locale.</li></ul>` },

{ id: 'e8', p: 2, t: 'Garanties sur demande — URDG 758', h: `
<p>Les <b>Règles Uniformes de la CCI relatives aux garanties sur demande (URDG 758)</b> encadrent des garanties <b>indépendantes du contrat sous-jacent</b> : la banque paie sur demande écrite conforme, sans discuter du litige.</p>
<table><tr><th>Garantie</th><th>Usage</th></tr>
<tr><td>De soumission (bid bond)</td><td>Appel d'offres : le candidat s'engage à signer s'il est retenu.</td></tr>
<tr><td>De bonne exécution (performance)</td><td>Couvre la bonne exécution du contrat, souvent 5–10 % du montant.</td></tr>
<tr><td>De restitution d'acompte (advance payment)</td><td>Rembourse l'acompte si le vendeur ne livre pas.</td></tr>
<tr><td>De retenue de garantie</td><td>Remplace la retenue sur paiement pendant la période de garantie.</td></tr>
<tr><td>Contre-garantie</td><td>Garantie donnée à la banque locale qui émet pour le compte du client.</td></tr></table>
<ul><li>Examen d'une demande : <b>5 jours ouvrés</b> maximum (art. 20).</li><li>Date d'expiration ou événement d'expiration impératifs — surveiller la restitution de l'original.</li><li>Demande « extend or pay » : prolonger ou payer.</li></ul>` },

{ id: 'e9', p: 2, t: 'SWIFT, virements et frais', h: `
<p>SWIFT est le réseau de messagerie sécurisée interbancaire. Il transporte l'information, pas l'argent (qui circule par comptes de correspondants).</p>
<table><tr><th>Message</th><th>Usage</th></tr>
<tr><td>MT700</td><td>Émission d'un crédit documentaire</td></tr>
<tr><td>MT103</td><td>Virement client unique</td></tr>
<tr><td>MT202</td><td>Transfert entre institutions financières</td></tr>
<tr><td>MT760</td><td>Garantie / stand-by</td></tr>
<tr><td>MT400 / MT410</td><td>Avis de paiement / accusé de réception (remises)</td></tr></table>
<ul><li><b>BIC</b> (8 ou 11 caractères) identifie la banque ; <b>IBAN</b> identifie le compte (zone SEPA/Europe, Afrique du Nord ; l'UEMOA utilise un format IBAN également).</li><li>Options de frais : <b>OUR</b> (le donneur d'ordre paie tout), <b>SHA</b> (partagés), <b>BEN</b> (le bénéficiaire paie tout).</li><li>Migration ISO 20022 : les paiements transfrontaliers migrent des MT vers les messages MX (ex. MT103 → pacs.008). Les messages de la catégorie 7 (crédoc, garanties) restent en MT à ce jour — à vérifier selon votre banque.</li></ul>` },

{ id: 'e10', p: 2, t: 'Risque de change et risque de taux', h: `
<h4>Risque de change</h4>
<p>Écart entre le cours à la facturation et celui à l'encaissement. Un exportateur facturant en USD perd si l'USD baisse ; un importateur payant en USD perd si l'USD monte.</p>
<table><tr><th>Outil</th><th>Principe</th></tr>
<tr><td>Change à terme (forward)</td><td>Fixe aujourd'hui un cours pour une échéance future ; engagement ferme, coût = points de terme.</td></tr>
<tr><td>Option de change</td><td>Droit (non obligation) d'acheter/vendre à un cours fixé, moyennant une prime.</td></tr>
<tr><td>Facturation en devise locale</td><td>Reporte le risque sur l'acheteur (au prix de la compétitivité).</td></tr>
<tr><td>Compte en devises / netting</td><td>Compense les encaissements et décaissements dans la même devise.</td></tr>
<tr><td>Clause d'indexation / de révision</td><td>Partage contractuel de la variation au-delà d'un seuil.</td></tr>
<tr><td>Assurance change</td><td>Garantie publique ou privée (ex. Coface, Bpifrance en France).</td></tr></table>
<h4>Risque de taux</h4>
<p>Variation des taux d'intérêt sur un financement à taux variable : couvert par swap de taux, cap (plafond), floor, ou emprunt à taux fixe.</p>
<div class="tip">Franc CFA : parité fixe avec l'euro (1 € = 655,957 F CFA) → pas de risque de change EUR/XOF, mais risque USD/XOF résiduel.</div>` },

{ id: 'e11', p: 2, t: 'Factoring et forfaiting', h: `
<table><tr><th></th><th>Factoring</th><th>Forfaiting</th></tr>
<tr><td>Nature</td><td>Cession de créances commerciales (court terme)</td><td>Rachat de créances export à moyen terme</td></tr>
<tr><td>Services</td><td>Financement + gestion des comptes + recouvrement + garantie du risque</td><td>Escompte pur, <b>sans recours</b> sur l'exportateur</td></tr>
<tr><td>Supports</td><td>Factures sur de nombreux clients</td><td>Effets avalisés, lettres de crédit, billets à ordre</td></tr>
<tr><td>Durée</td><td>30–180 jours</td><td>6 mois à 7 ans</td></tr>
<tr><td>Usage typique</td><td>PME avec flux récurrents</td><td>Gros contrats d'équipements</td></tr></table>
<p>Dans les deux cas, la qualité du débiteur/de la banque avaliste détermine le coût. Le forfaiting transfère les risques (commercial, politique, change) au forfaiteur.</p>` },

{ id: 'e12', p: 2, t: 'Hiérarchie de sécurité des moyens de paiement', h: `
<table><tr><th>Rang</th><th>Moyen</th><th>Sécurité pour l'exportateur</th></tr>
<tr><td>1</td><td>Paiement d'avance (virement)</td><td>Maximale (mais difficile à obtenir)</td></tr>
<tr><td>2</td><td>Crédoc irrévocable et confirmé</td><td>Très élevée</td></tr>
<tr><td>3</td><td>Crédoc irrévocable non confirmé</td><td>Élevée (dépend de la banque émettrice)</td></tr>
<tr><td>4</td><td>Stand-by / garantie bancaire</td><td>Élevée en cas de défaut</td></tr>
<tr><td>5</td><td>Remise documentaire D/P</td><td>Moyenne</td></tr>
<tr><td>6</td><td>Remise documentaire D/A (avec aval)</td><td>Faible à moyenne</td></tr>
<tr><td>7</td><td>Virement après livraison / compte ouvert</td><td>Faible (assurance-crédit recommandée)</td></tr></table>
<p>Un compromis courant : acompte (30 %) + solde par crédoc ou remise documentaire.</p>` },

/* ============== PILIER 3 — TRANSPORT, LOGISTIQUE & DOUANE ============== */
{ id: 'e13', p: 3, t: 'Rapport poids/volume et « payant pour »', h: `
<p>Le transporteur facture le <b>poids taxable</b> (payant pour) : le plus élevé entre le poids réel (« utile » : poids brut de la marchandise emballée) et le poids volumétrique.</p>
<table><tr><th>Mode</th><th>Équivalence</th><th>Formule</th></tr>
<tr><td>Maritime (groupage LCL)</td><td><b>1 t = 1 m³</b></td><td>W/M : on retient la plus grande valeur entre tonnes et m³</td></tr>
<tr><td>Routier</td><td><b>1 t = 1 m³</b> (convention de cette application)</td><td>Poids taxable = max(poids réel ; volume × 1 000 kg/m³)</td></tr>
<tr><td>Aérien</td><td><b>1 t = 6 m³</b> (≈ 167 kg/m³)</td><td>Volume en cm³ ÷ 6 000 = poids volumétrique en kg</td></tr></table>
<div class="tip"><b>Attention :</b> en pratique, le routier de groupage applique souvent 1 m³ ≈ 333 kg ou 1 mètre linéaire (ldm) ≈ 1 850 kg selon le barème du transporteur. Le calculateur permet de modifier le ratio : vérifiez toujours les conditions de votre transporteur.</div>
<p><b>Exemple aérien :</b> 1 colis 120×80×100 cm, 90 kg réels. Volume = 960 000 cm³ ÷ 6 000 = 160 kg volumétriques → <b>160 kg facturés</b>.</p>
<p>Conteneurs complets (FCL) : tarif forfaitaire par conteneur (20', 40', 40' HC), indépendamment du poids/volume, dans la limite de charge utile.</p>` },

{ id: 'e14', p: 3, t: 'Liasse documentaire : B/L, LTA, CMR et autres', h: `
<table><tr><th>Document</th><th>Mode</th><th>Caractéristiques</th></tr>
<tr><td><b>B/L</b> (Bill of Lading, connaissement)</td><td>Maritime</td><td>3 fonctions : reçu de marchandise, preuve du contrat de transport, <b>titre représentatif de la marchandise</b> (négociable). Émis en 3 originaux ; un seul suffit à retirer la marchandise. « Shipped on board » et « clean » exigés en crédoc.</td></tr>
<tr><td>Sea waybill</td><td>Maritime</td><td>Non négociable ; livraison au destinataire nommé sans original ; rapide mais pas de titre.</td></tr>
<tr><td><b>LTA / AWB</b> (lettre de transport aérien)</td><td>Aérien</td><td>Non négociable ; reçu + preuve du contrat ; 3 originaux ; numéro de 11 chiffres (préfixe compagnie).</td></tr>
<tr><td><b>CMR</b> (lettre de voiture)</td><td>Routier</td><td>Convention de Genève 1956 ; 3 exemplaires (expéditeur, destinataire, transporteur) ; non négociable ; responsabilité limitée à 8,33 DTS/kg.</td></tr>
<tr><td>CIM</td><td>Ferroviaire</td><td>Convention COTIF.</td></tr>
<tr><td>FBL (FIATA)</td><td>Multimodal</td><td>Document émis par un commissionnaire de transport.</td></tr></table>
<h4>Autres documents de la liasse</h4>
<ul><li>Facture commerciale et facture pro forma ; liste de colisage (packing list) ; certificat d'assurance ; certificat d'origine ; certificats sanitaires/phytosanitaires ; EX-A/EAD (preuve de sortie) ; T1 (transit) ; carnet ATA ; déclaration en douane.</li></ul>` },

{ id: 'e15', p: 3, t: 'Origine et préférences : EUR.1, ATR, Form A', h: `
<table><tr><th>Document</th><th>Rôle</th></tr>
<tr><td><b>EUR.1</b></td><td>Certificat de circulation attestant l'origine préférentielle dans le cadre d'accords UE–pays tiers (droits réduits ou nuls). Visé par la douane ; dans certains accords, remplacé par une <i>déclaration d'origine</i> sur facture (exportateur agréé).</td></tr>
<tr><td><b>ATR</b></td><td>Certificat de circulation pour les produits industriels entre l'UE et la Turquie (union douanière).</td></tr>
<tr><td><b>Form A</b></td><td>Certificat d'origine du Système de Préférences Généralisées (SPG) pour les pays en développement. L'UE l'a remplacé par le système <b>REX</b> (exportateur enregistré) depuis 2017.</td></tr>
<tr><td>Certificat d'origine non préférentiel</td><td>Émis par la chambre de commerce ; prouve l'origine sans réduction tarifaire.</td></tr></table>
<p>L'origine se détermine par des <b>règles d'origine</b> (changement de position tarifaire, valeur ajoutée, transformation suffisante). L'origine n'est pas la provenance : un produit expédié depuis un pays n'en est pas forcément originaire.</p>
<div class="tip">Pour la Côte d'Ivoire : l'accord de partenariat économique (APE) avec l'UE offre un accès préférentiel ; les règles d'origine et la preuve exigée sont à vérifier auprès de la douane.</div>` },

{ id: 'e16', p: 3, t: 'Code SH, tarif douanier et valeur en douane', h: `
<h4>Le Système Harmonisé (SH)</h4>
<ul><li><b>6 chiffres</b> communs à plus de 200 pays (OMD) : 21 sections, 97 chapitres. Révisé tous les 5 ans (SH 2022 en vigueur, SH 2027 à venir).</li><li><b>8 chiffres</b> : Nomenclature Combinée (UE) ; <b>10 chiffres</b> : TARIC (UE) ; la Côte d'Ivoire applique le <b>Tarif Extérieur Commun CEDEAO</b> avec 5 taux (0 %, 5 %, 10 %, 20 %, 35 %).</li><li>Classement selon les <b>Règles Générales d'Interprétation (RGI 1 à 6)</b> ; en cas de doute : renseignement tarifaire contraignant (RTC/ RTC-UE).</li></ul>
<h4>Valeur en douane</h4>
<p>Fondée sur la <b>valeur transactionnelle</b> (Accord de l'OMC sur l'évaluation) : prix réellement payé ou à payer, + frais de transport et d'assurance jusqu'à la frontière d'entrée (soit la valeur <b>CIF</b>), + commissions, redevances, emballages rattachés.</p>
<div class="key">Valeur en douane (UE) = FOB + fret + assurance jusqu'au point d'entrée = <b>CIF</b> à la frontière.</div>` },

{ id: 'e17', p: 3, t: 'Régimes douaniers suspensifs (régimes particuliers)', h: `
<p>Ils permettent de suspendre droits de douane et TVA tant que la marchandise ne passe pas à la consommation.</p>
<table><tr><th>Régime</th><th>Principe</th><th>Exemple</th></tr>
<tr><td><b>Transit</b> (T1 / T2, NCTS)</td><td>Circulation sous douane d'un bureau à un autre</td><td>Marchandise Abidjan → Bamako</td></tr>
<tr><td><b>Entrepôt douanier</b></td><td>Stockage sous douane</td><td>Alcool, tabac, vrac</td></tr>
<tr><td><b>Admission temporaire / carnet ATA</b></td><td>Importation temporaire en suspension totale ou partielle</td><td>Matériel de salon, échantillons</td></tr>
<tr><td><b>Perfectionnement actif</b></td><td>Importation pour transformation puis réexportation</td><td>Cacao importé, transformé, réexporté</td></tr>
<tr><td><b>Perfectionnement passif</b></td><td>Exportation temporaire pour transformation à l'étranger</td><td>Pièces envoyées en réparation</td></tr>
<tr><td><b>Destination particulière</b></td><td>Droits réduits ou nuls selon l'usage final</td><td>Aéronefs, usage militaire</td></tr>
<tr><td><b>Zone franche</b></td><td>Territoire à régime fiscal et douanier de faveur</td><td>Zone industrielle exportatrice</td></tr></table>` },

{ id: 'e18', p: 3, t: 'Dédouanement : DELTA et déclarations', h: `
<p>En France, <b>DELTA</b> (Dédouanement En Ligne par Traitement Automatisé) est le système de déclaration en douane. Un opérateur doit disposer d'un numéro <b>EORI</b>.</p>
<table><tr><th>Déclaration</th><th>Usage</th></tr>
<tr><td>H1</td><td>Mise en libre pratique — importation standard</td></tr>
<tr><td>H7</td><td>Envois de faible valeur (≤ 150 €)</td></tr>
<tr><td>H6</td><td>Envois postaux</td></tr>
<tr><td>EX-A / EAD</td><td>Déclaration d'exportation et preuve de sortie du territoire de l'UE (e-AES)</td></tr></table>
<h4>Étapes d'un dédouanement import</h4>
<ol><li>Arrivée des marchandises, notification (manifeste, arrivée).</li><li>Dépôt de la déclaration (classement SH, origine, valeur).</li><li>Contrôle documentaire / physique éventuel (circuits vert, orange, rouge).</li><li>Paiement des droits et taxes (ou autoliquidation de la TVA).</li><li>Bon à enlever (BAE) et sortie de marchandise.</li></ol>
<div class="tip"><b>Point de vigilance :</b> la mention « H8 » n'existe pas, à notre connaissance, parmi les déclarations d'importation standards (H1 à H7). Si ce code figure dans votre documentation, vérifiez-le auprès de votre commissionnaire en douane ou du guichet DELTA.</div>` },

{ id: 'e19', p: 3, t: 'TVA à l\'import, à l\'export et autoliquidation', h: `
<ul><li><b>Exportation hors UE :</b> livraison exonérée de TVA (art. 262 I du CGI) sous réserve de la preuve de sortie (EX-A/e-AES).</li><li><b>Importation :</b> la TVA est due à l'import sur la valeur en douane + droits + autres taxes. Elle est généralement récupérable par un assujetti.</li><li><b>Autoliquidation de la TVA à l'importation (France) :</b> l'importateur déclare la TVA import sur sa déclaration de TVA (CA3) et la déduit simultanément, sans la payer à la douane : impact de trésorerie nul.</li><li><b>Autoliquidation intra-UE :</b> pour les services B2B, le preneur assujetti déclare la TVA.</li></ul>
<h4>Calcul à l'importation</h4>
<div class="key">CIF → Droits de douane = CIF × taux → Autres taxes → Base TVA = CIF + droits + autres taxes → TVA = base × taux → <b>Coût de revient DDP</b> = CIF + droits + taxes + TVA (si non récupérable) + frais d'approche et de livraison.</div>` },

{ id: 'e20', p: 3, t: 'Zoom Côte d\'Ivoire / UEMOA : taxes à l\'importation (indicatif)', h: `
<ul><li><b>Droit de douane (DD)</b> : taux du TEC CEDEAO (0 / 5 / 10 / 20 / 35 %) selon la position tarifaire.</li><li><b>Redevance statistique (RS)</b> : 1 %.</li><li><b>Prélèvement communautaire de solidarité (PCS UEMOA)</b> : 0,5 %.</li><li><b>Prélèvement CEDEAO (PC)</b> : 0,5 %.</li><li><b>TVA</b> : 18 % sur la base CIF + DD + autres taxes.</li><li>Autres : droits d'accises, frais de transit, frais de manutention et de port.</li></ul>
<div class="tip"><b>À vérifier :</b> les taux, les taxes additionnelles et les exonérations évoluent avec les lois de finances. Confirmez avec la douane ivoirienne ou un transitaire agréé avant de chiffrer. Le calculateur de l'onglet « Calculateurs » inclut un préréglage indicatif.</div>
<p>Les formalités passent par le <b>Guichet Unique du Commerce Extérieur (GUCE)</b> et le système de déclaration douanière de la Direction Générale des Douanes.</p>` },

/* =================== PILIER 4 — CONTRATS, DROIT & NÉGOCIATION =================== */
{ id: 'e21', p: 4, t: 'Clauses de force majeure', h: `
<p>Droit français (art. 1218 C. civ.) : événement échappant au contrôle du débiteur, <b>imprévisible</b> lors de la conclusion du contrat et dont les effets ne peuvent être évités par des mesures appropriées. Effets : suspension, puis résolution de plein droit si l'empêchement est définitif.</p>
<h4>Rédaction recommandée</h4>
<ul><li>Liste d'événements (guerre, catastrophe naturelle, grève générale, embargo, pandémie, cyberattaque majeure…) et exclusions (difficultés économiques, hausse de prix).</li><li><b>Notification écrite</b> dans un délai court (ex. 5–10 jours) avec preuves.</li><li>Obligation de limiter les effets (mitigation).</li><li>Durée-seuil au-delà de laquelle chaque partie peut résilier (ex. 90 ou 120 jours).</li><li>Sort des paiements et des stocks.</li></ul>
<p>La CCI propose une <b>clause modèle Force Majeure 2020</b> ; la CVIM (art. 79) prévoit aussi une exonération pour empêchement hors de contrôle.</p>` },

{ id: 'e22', p: 4, t: 'Hardship (imprévision) et renégociation', h: `
<p>Le hardship vise le cas où l'exécution reste <b>possible mais devient excessivement onéreuse</b> à cause d'un événement imprévisible (flambée des prix de l'énergie ou des matières, dévaluation).</p>
<ul><li>Droit français : art. 1195 C. civ. — renégociation, puis éventuellement révision/résolution par le juge si échec.</li><li>Principes UNIDROIT (art. 6.2.2) : définition du hardship et droit à la renégociation.</li><li>Clause CCI Hardship 2020 : notification, renégociation dans un délai raisonnable, puis adaptation ou résiliation.</li></ul>
<div class="tip">Différence essentielle : <b>force majeure = impossibilité</b> ; <b>hardship = difficulté excessive</b> menant à renégocier. Ne pas les confondre dans le contrat.</div>` },

{ id: 'e23', p: 4, t: 'Intérêts de retard et pénalités', h: `
<ul><li><b>France (B2B)</b> : taux de pénalités de retard obligatoire, au moins <b>3 fois le taux d'intérêt légal</b>, + <b>indemnité forfaitaire de recouvrement de 40 €</b> (art. L441-10 C. com.). Délai de paiement maximal : <b>60 jours</b> à compter de la date de facture ou <b>45 jours fin de mois</b>.</li><li><b>International</b> : la CVIM (art. 78) accorde des intérêts sans fixer le taux ; mieux vaut le fixer par contrat (ex. SOFR/EURIBOR + marge).</li><li>Pénalités de retard de livraison : % par semaine (ex. 0,5 %), plafonnées (5–10 % du prix) ; libératoires ou non.</li><li>Clause de <b>réserve de propriété</b> pour sécuriser le paiement.</li></ul>` },

{ id: 'e24', p: 4, t: 'Droit applicable et juridiction', h: `
<ul><li><b>CVIM / CISG (Vienne, 1980)</b> : droit uniforme de la vente internationale de marchandises ; s'applique automatiquement entre États contractants, sauf exclusion expresse (art. 6).</li><li><b>Règlement Rome I</b> (UE) : liberté de choisir la loi applicable ; à défaut, la loi du vendeur pour la vente de biens.</li><li><b>OHADA</b> (17 États africains, dont la Côte d'Ivoire) : Acte uniforme relatif au droit commercial général (vente commerciale) ; arbitrage via la CCJA.</li><li>Choix de juridiction : tribunal étatique (clause attributive) ou arbitrage.</li></ul>
<div class="tip">Les Incoterms ne désignent ni la loi applicable ni le tribunal compétent : il faut les prévoir dans le contrat.</div>` },

{ id: 'e25', p: 4, t: 'Arbitrage CCI', h: `
<ul><li><b>Règlement d'arbitrage de la CCI (2021)</b> administré par la Cour internationale d'arbitrage (Paris).</li><li>1 ou 3 arbitres ; Acte de mission ; sentence contrôlée par la Cour.</li><li>Sentences exécutables dans plus de 170 États grâce à la <b>Convention de New York (1958)</b>.</li><li>Avantages : neutralité, confidentialité, exécution internationale ; inconvénients : coût, durée, peu de voies de recours.</li></ul>
<h4>Clause type recommandée</h4>
<div class="key">« Tous différends découlant du présent contrat ou en relation avec celui-ci seront tranchés définitivement suivant le Règlement d'arbitrage de la Chambre de Commerce Internationale par un ou plusieurs arbitres nommés conformément à ce Règlement. »</div>
<p>À compléter : siège de l'arbitrage, nombre d'arbitres, langue, loi applicable.</p>` },

{ id: 'e26', p: 4, t: 'Risque pays, Coface, Atradius et assurance-crédit', h: `
<ul><li><b>Évaluation pays Coface</b> : de A1 (très faible risque) à E (extrême), via A2, A3, A4, B, C, D. <b>Atradius</b> publie des analyses de pays et notes similaires.</li><li><b>Assurance-crédit</b> : couvre les risques <b>commerciaux</b> (insolvabilité, défaut prolongé) et <b>politiques</b> (transfert, guerre, expropriation, annulation de licence) ; quotité couverte souvent de 80 à 90 %.</li><li>Acteurs : Coface, Atradius, Euler Hermes (Allianz Trade), Bpifrance Assurance Export (France), African Trade Insurance Agency (ATI), ATIDI.</li><li>Outils complémentaires : confirmation de crédoc, avals, garanties bancaires, cession Dailly, forfaiting.</li></ul>
<div class="tip">Procédure : consulter la note pays → évaluer l'acheteur → fixer un plafond de garantie → choisir le moyen de paiement adapté au niveau de risque.</div>` },

{ id: 'e27', p: 4, t: 'Clauses essentielles du contrat de vente internationale et négociation', h: `
<ol><li>Parties, objet, spécifications et quantités.</li><li>Prix, devise, révision de prix.</li><li><b>Incoterm + lieu + version</b>.</li><li>Conditions de paiement et garanties.</li><li>Délais, pénalités de retard, conditions de réception et d'inspection.</li><li>Transfert de propriété / réserve de propriété.</li><li>Garantie et responsabilité (plafonds, exclusions).</li><li>Force majeure et hardship.</li><li>Propriété intellectuelle et confidentialité.</li><li>Résiliation, loi applicable, juridiction/arbitrage, langue.</li></ol>
<h4>Négociation</h4>
<ul><li>Préparer votre <b>BATNA</b> (meilleure solution de rechange) et votre prix limite.</li><li>Séparer les concessions : prix, délai, paiement, garanties — ne cédez jamais gratuitement.</li><li>Respecter les codes culturels (hiérarchie, rapport au temps, importance de la relation).</li><li>Confirmer par écrit chaque accord, avant la signature.</li></ul>` },

/* =================== PILIER 5 — DÉMARCHES IMPORT/EXPORT =================== */
{ id: 'e28', p: 5, t: 'Processus export complet en 12 étapes', h: `
<ol>
<li><b>Étude de marché et ciblage :</b> demande, concurrence, réglementation, barrières, droits de douane.</li>
<li><b>Vérifications réglementaires :</b> licences, normes, sanctions/embargos, biens à double usage, certificats sanitaires.</li>
<li><b>Chiffrage de l'offre :</b> coût de revient export → prix (voir fiche dédiée).</li>
<li><b>Offre et facture pro forma :</b> Incoterm, validité, conditions de paiement.</li>
<li><b>Négociation et contrat :</b> clauses essentielles, droit applicable, arbitrage.</li>
<li><b>Sécurisation du paiement :</b> crédoc, garantie, assurance-crédit.</li>
<li><b>Production, emballage, marquage :</b> norme NIMP 15 pour le bois, étiquetage, palettisation.</li>
<li><b>Transport et assurance :</b> réservation du fret, assurance ICC (A) (B) (C).</li>
<li><b>Dédouanement export :</b> déclaration, EORI, EX-A/EAD.</li>
<li><b>Liasse documentaire :</b> facture, colisage, B/L/LTA/CMR, certificats d'origine, assurance.</li>
<li><b>Suivi de la livraison :</b> tracking, réserves à réception, preuve de livraison.</li>
<li><b>Encaissement, relances, retour d'expérience :</b> relances, gestion des litiges, enregistrement des leçons.</li></ol>` },

{ id: 'e29', p: 5, t: 'Chiffrage de l\'offre : du coût de revient au prix', h: `
<table><tr><th>Poste</th><th>Description</th></tr>
<tr><td>1. Prix de revient départ usine</td><td>Matières, main-d'œuvre, frais généraux</td></tr>
<tr><td>2. + Marge</td><td>Marge cible sur le prix de revient</td></tr>
<tr><td>3. = Prix EXW</td><td></td></tr>
<tr><td>4. + Emballage export, marquage</td><td>Caisses, palettes, traitement phytosanitaire</td></tr>
<tr><td>5. + Pré-acheminement et manutention</td><td>Camion jusqu'au terminal, THC</td></tr>
<tr><td>6. + Dédouanement export</td><td>Frais de transit, certificats</td></tr>
<tr><td>7. = Prix FCA</td><td></td></tr>
<tr><td>8. + Fret principal</td><td>Maritime, aérien, routier</td></tr>
<tr><td>9. = Prix CPT</td><td></td></tr>
<tr><td>10. + Assurance (110 % × taux)</td><td></td></tr>
<tr><td>11. = Prix CIP/CIF</td><td></td></tr>
<tr><td>12. + Frais financiers, provision de change et de risque</td><td>Crédoc, escompte, couverture</td></tr>
<tr><td>13. + Frais d'approche, droits et taxes import</td><td>Si DDP</td></tr>
<tr><td>14. = Prix DAP / DDP</td><td></td></tr></table>
<div class="tip">Construisez le prix « par couches » d'Incoterm en Incoterm : vous pouvez ainsi répondre à n'importe quelle demande de devis sans recalculer.</div>` },

{ id: 'e30', p: 5, t: 'Processus import en 10 étapes', h: `
<ol><li>Définir le besoin, sourcer et qualifier les fournisseurs (références, audit, échantillons).</li><li>Vérifier la <b>réglementation d'importation</b> : licences, normes, interdictions, autorisations sanitaires.</li><li>Négocier prix, Incoterm, délais, paiement.</li><li>Calculer le <b>coût de revient DDP</b> (CIF + droits + taxes + frais).</li><li>Sécuriser le paiement (crédoc, remise documentaire, virement) et l'assurance.</li><li>Choisir transitaire/transporteur, organiser l'enlèvement.</li><li>Suivre l'expédition, recevoir les documents originaux.</li><li>Dédouaner (déclaration, droits, taxes, BAE).</li><li>Livraison finale, contrôle qualité, réserves contre transporteur sous délai légal.</li><li>Suivre les paiements, archiver (conserver les documents plusieurs années) et évaluer le fournisseur.</li></ol>` },

{ id: 'e31', p: 5, t: 'Check-list avant expédition', h: `
<ul><li>☐ Contrat / commande confirmée, Incoterm et lieu précisés.</li><li>☐ Paiement sécurisé (crédoc ouvert et conforme, acompte reçu).</li><li>☐ Marchandise conforme (quantités, qualité, inspection avant expédition si exigée).</li><li>☐ Emballage adapté, marquage, NIMP 15 si bois.</li><li>☐ Assurance conforme aux exigences (110 %, clause adéquate).</li><li>☐ Facture commerciale, packing list, certificat d'origine, certificats spécifiques.</li><li>☐ Réservation de fret confirmée, cut-off respecté.</li><li>☐ Déclaration d'export déposée, EORI valide.</li><li>☐ Documents de transport vérifiés vs conditions du crédoc (noms, dates, descriptions).</li><li>☐ Dossier archivé et client informé (préavis d'expédition).</li></ul>` },

{ id: 'e32', p: 5, t: 'Glossaire du commerce international (A–Z)', h: `
<table><tr><th>Terme</th><th>Définition</th></tr>
<tr><td>AWB / LTA</td><td>Air Waybill : lettre de transport aérien.</td></tr>
<tr><td>Aval</td><td>Garantie donnée par un tiers (souvent une banque) sur le paiement d'un effet.</td></tr>
<tr><td>B/L</td><td>Bill of Lading : connaissement maritime, titre négociable.</td></tr>
<tr><td>BAE</td><td>Bon à enlever : autorisation douanière de sortie de la marchandise.</td></tr>
<tr><td>BATNA</td><td>Best Alternative To a Negotiated Agreement : votre meilleure solution de repli en négociation.</td></tr>
<tr><td>CAF / CIF</td><td>Coût, Assurance, Fret (valeur en douane à l'entrée).</td></tr>
<tr><td>CCI / ICC</td><td>Chambre de Commerce Internationale (éditrice des Incoterms, RUU, URDG, règlement d'arbitrage).</td></tr>
<tr><td>CVIM / CISG</td><td>Convention de Vienne de 1980 sur la vente internationale de marchandises.</td></tr>
<tr><td>Cut-off</td><td>Date et heure limites de remise de la marchandise au terminal ou à la compagnie.</td></tr>
<tr><td>D/A, D/P</td><td>Documents contre Acceptation, Documents contre Paiement (remise documentaire).</td></tr>
<tr><td>Demurrage</td><td>Surestaries : frais pour conteneur gardé au terminal au-delà du temps libre.</td></tr>
<tr><td>Detention</td><td>Frais d'immobilisation du conteneur hors terminal au-delà du délai de restitution.</td></tr>
<tr><td>DTS</td><td>Droits de tirage spéciaux : unité de compte du FMI utilisée dans les conventions de transport.</td></tr>
<tr><td>EORI</td><td>Numéro d'identification des opérateurs économiques (UE).</td></tr>
<tr><td>FCL / LCL</td><td>Conteneur complet / groupage.</td></tr>
<tr><td>Forwarder</td><td>Transitaire / commissionnaire de transport.</td></tr>
<tr><td>HS / SH</td><td>Système Harmonisé de désignation et de codification des marchandises.</td></tr>
<tr><td>ISBP</td><td>Pratique bancaire internationale standard pour l'examen des documents de crédoc.</td></tr>
<tr><td>LDM</td><td>Mètre linéaire de plancher de camion (unité de tarification routière).</td></tr>
<tr><td>NIMP 15 / ISPM 15</td><td>Norme phytosanitaire pour les emballages en bois.</td></tr>
<tr><td>OEA / AEO</td><td>Opérateur économique agréé (statut douanier de confiance).</td></tr>
<tr><td>Pro forma</td><td>Facture d'offre non comptable.</td></tr>
<tr><td>REX</td><td>Système des exportateurs enregistrés (origine préférentielle, UE).</td></tr>
<tr><td>RUU 600 / UCP 600</td><td>Règles et usances uniformes relatives aux crédits documentaires.</td></tr>
<tr><td>SPG</td><td>Système de préférences généralisées.</td></tr>
<tr><td>Stand-by</td><td>Lettre de crédit de garantie, exécutée en cas de défaut.</td></tr>
<tr><td>TARIC</td><td>Tarif intégré de l'UE (10 chiffres).</td></tr>
<tr><td>TEC</td><td>Tarif Extérieur Commun (CEDEAO/UEMOA).</td></tr>
<tr><td>THC</td><td>Terminal Handling Charges : frais de manutention au terminal.</td></tr>
<tr><td>T1 / T2</td><td>Documents de transit (marchandises non communautaires / communautaires).</td></tr>
<tr><td>URC 522 / RDM 522</td><td>Règles uniformes relatives aux encaissements (remise documentaire).</td></tr>
<tr><td>URDG 758</td><td>Règles uniformes pour les garanties sur demande.</td></tr>
<tr><td>W/M</td><td>Weight/Measurement : base de facturation maritime (1 t ou 1 m³, au plus élevé).</td></tr></table>` }
];

C(1, 'Quel Incoterm impose le maximum d\'obligations au vendeur ?', 'DDP : le vendeur supporte transport, risques jusqu\'à destination et dédouanement import (droits et taxes inclus).'),
C(1, 'Quel Incoterm impose le minimum d\'obligations au vendeur ?', 'EXW : le vendeur met simplement la marchandise à disposition dans ses locaux.'),
C(1, 'Sous EXW, qui assure le dédouanement à l\'exportation et pourquoi est-ce un piège ?', 'L\'acheteur. Un acheteur étranger peut difficilement accomplir cette formalité : FCA est plus adapté.'),
C(1, 'Quelle différence entre DAP et DPU ?', 'DAP : marchandise mise à disposition prête au déchargement sur le moyen de transport arrivant. DPU : le vendeur décharge la marchandise au lieu convenu.'),
C(1, 'Quelle nouveauté d\'Incoterms 2020 concerne le B/L sous FCA ?', 'L\'acheteur et le vendeur peuvent convenir que l\'acheteur ordonne au transporteur d\'émettre un B/L « On Board » au vendeur, qui le transmet à l\'acheteur (utile en crédoc).'),
C(1, 'Les Incoterms règlent-ils le transfert de propriété, le paiement ou le droit applicable ?', 'Non : ils ne règlent ni la propriété, ni le prix/paiement, ni le droit applicable, ni les conséquences d\'une rupture de contrat.'),
C(1, 'Sous CPT, qui paie le transport principal et où le risque se transfère-t-il ?', 'Le vendeur paie le transport principal, mais le risque est transféré à la remise de la marchandise au premier transporteur : transfert des risques ≠ transfert des coûts.'),
C(1, 'Comment citer correctement un Incoterm ?', 'Règle + lieu précis + version : par exemple « FCA Terminal de Vridi, Abidjan Incoterms® 2020 ».'),
/* Pilier 2 */
C(2, 'Que signifie RUU 600 ?', 'Règles et Usances Uniformes de la CCI relatives aux crédits documentaires (UCP 600).'),
C(2, 'Quels sont les 3 caractères essentiels d\'un crédit documentaire ?', 'Engagement de paiement d\'une banque, autonomie par rapport au contrat de vente, et paiement sur présentation de documents conformes (pas sur la marchandise).'),
C(2, 'Quel est le délai d\'examen des documents par la banque sous RUU 600 ?', '5 jours ouvrés bancaires maximum suivant le jour de la présentation (art. 14).'),
C(2, 'Quel est le délai de présentation par défaut après l\'expédition ?', '21 jours calendaires après la date d\'expédition, sans dépasser la date d\'expiration du crédit.'),
C(2, 'Un crédit documentaire est-il révocable par défaut ?', 'Non. Sous les RUU 600, il est irrévocable par nature (art. 3).'),
C(2, 'Différence entre crédoc notifié et confirmé ?', 'Notifié : la banque notificatrice avise sans s\'engager. Confirmé : une banque confirmatrice ajoute son propre engagement, couvrant le risque de la banque émettrice et le risque pays.'),
C(2, 'Que faire en cas de discordance documentaire ?', 'Corriger les documents si le temps le permet ; sinon demander un amendement ou une renonciation (waiver) à l\'acheteur via les banques. Des frais de discordance s\'appliquent souvent.'),
C(2, 'Différence entre remise documentaire D/P et D/A ?', 'D/P : documents remis contre paiement. D/A : documents remis contre acceptation d\'une traite à échéance, donc paiement différé et risque supérieur.'),
C(2, 'Quelles règles de la CCI encadrent la remise documentaire ?', 'RDM 522 (Règles uniformes relatives aux encaissements, URC 522).'),
C(2, 'La remise documentaire garantit-elle le paiement ?', 'Non. Les banques n\'ont aucun engagement de paiement ; l\'importateur peut refuser de retirer les documents.'),
C(2, 'Quelle est la nature d\'une garantie sous URDG 758 ?', 'Une garantie indépendante à première demande : la banque paie sur demande conforme, sans discuter du litige sous-jacent.'),
C(2, 'Citez quatre types de garanties de marché.', 'Garantie de soumission (bid bond), de bonne exécution (performance bond), de restitution d\'acompte (advance payment guarantee) et de retenue de garantie.'),
C(2, 'Quel message SWIFT sert à émettre un crédit documentaire ?', 'MT700. (MT103 = virement client ; MT202 = transfert interbancaire ; MT760 = garantie.)'),
C(2, 'Que signifient les options de frais OUR, SHA, BEN ?', 'OUR : le donneur d\'ordre paie tous les frais. SHA : frais partagés. BEN : le bénéficiaire supporte tous les frais.'),
C(2, 'Quelle différence entre factoring et forfaiting ?', 'Factoring : cession de créances à court terme avec financement, gestion et garantie. Forfaiting : rachat sans recours de créances export à moyen terme (effets avalisés, lettres de crédit).'),
C(2, 'Citez des outils de couverture du risque de change.', 'Change à terme (forward), option de change, swap, facturation en devise locale, compte en devises, netting, clause d\'indexation, assurance change.'),
C(2, 'Différence entre change à terme et option de change ?', 'Le terme est un engagement ferme à un cours fixé ; l\'option est un droit, non une obligation, acquis moyennant une prime.'),
/* Pilier 3 */
C(3, 'Quelle est l\'équivalence poids/volume en aérien et comment calculer le poids taxable ?', '1 t = 6 m³ (≈ 167 kg/m³). Poids volumétrique = (L×l×h en cm³) ÷ 6 000. Poids taxable = max(poids réel ; poids volumétrique).'),
C(3, 'Comment facture-t-on le fret maritime en groupage (LCL) ?', 'À l\'unité payante W/M : 1 t = 1 m³ ; on retient la valeur la plus élevée entre le poids en tonnes et le volume en m³.'),
C(3, 'Quelle convention routière utilise cette application et quelle nuance dans la pratique ?', 'Convention : 1 t = 1 m³. En pratique, les transporteurs de groupage appliquent souvent 1 m³ ≈ 333 kg ou 1 mètre linéaire ≈ 1 850 kg : toujours vérifier le barème.'),
C(3, 'Que signifie « poids payant » par rapport au poids « utile » ?', 'Le poids utile est le poids réel de la marchandise ; le poids payant (taxable) est celui sur lequel on facture : le plus élevé entre poids réel et poids volumétrique.'),
C(3, 'Quelles sont les trois fonctions du connaissement (B/L) ?', 'Reçu de marchandise, preuve du contrat de transport, titre représentatif de la marchandise (négociable).'),
C(3, 'Combien d\'originaux de B/L et quel risque ?', 'Généralement 3 originaux (3/3). Un seul suffit pour retirer la marchandise : tous doivent être contrôlés ou remis ensemble.'),
C(3, 'Différence entre B/L et sea waybill ?', 'Le sea waybill n\'est pas un titre négociable : la marchandise est livrée au destinataire nommé sans présenter d\'original, ce qui accélère la livraison.'),
C(3, 'Quelles sont les caractéristiques de la LTA (AWB) ?', 'Lettre de transport aérien : non négociable, reçu et preuve du contrat, 3 originaux, numéro de 11 chiffres dont le préfixe de la compagnie.'),
C(3, 'Qu\'est-ce que la CMR ?', 'Convention de Genève (1956) sur le transport routier international de marchandises ; lettre de voiture en 3 exemplaires, non négociable ; responsabilité limitée à 8,33 DTS/kg.'),
C(3, 'À quoi sert le certificat EUR.1 ?', 'Prouve l\'origine préférentielle dans le cadre d\'accords UE–pays tiers pour bénéficier de droits réduits ou nuls ; remplaçable par une déclaration d\'origine selon les accords.'),
C(3, 'À quoi sert le certificat ATR ?', 'Circulation des produits industriels entre l\'UE et la Turquie (union douanière).'),
C(3, 'Qu\'est-ce que le Form A et par quoi l\'UE l\'a-t-elle remplacé ?', 'Certificat d\'origine du SPG (Système de Préférences Généralisées). L\'UE l\'a remplacé par l\'attestation d\'origine REX (exportateur enregistré) en 2017.'),
C(3, 'Comment est structuré le code SH ?', '6 chiffres harmonisés (OMD) ; 8 chiffres = Nomenclature Combinée UE ; 10 chiffres = TARIC. 21 sections et 97 chapitres.'),
C(3, 'Comment détermine-t-on la valeur en douane dans l\'UE ?', 'Valeur transactionnelle (Accord OMC) + frais de transport et d\'assurance jusqu\'à la frontière UE, soit la valeur CIF à l\'entrée.'),
C(3, 'Citez les principaux régimes douaniers suspensifs.', 'Transit (T1), entrepôt douanier, admission temporaire (carnet ATA), perfectionnement actif et passif, destination particulière, zone franche.'),
C(3, 'À quoi sert le carnet ATA ?', 'C\'est un passeport douanier pour l\'admission temporaire (salons, échantillons, matériel professionnel) dans plus de 80 pays, sans droits ni TVA.'),
C(3, 'Qu\'est-ce que DELTA et que sont les déclarations H1 et H7 ?', 'DELTA : système informatisé de dédouanement de la douane française. H1 : importation standard (mise en libre pratique). H7 : envois de faible valeur (≤ 150 €).'),
C(3, 'En quoi consiste l\'autoliquidation de la TVA à l\'importation ?', 'L\'importateur assujetti déclare et déduit la TVA import sur sa déclaration de TVA (CA3) au lieu de la payer à la douane : impact de trésorerie neutre.'),
C(3, 'Quel est le traitement de TVA d\'une exportation hors UE ?', 'Exonération (art. 262 I CGI) sous réserve de la preuve de sortie du territoire (EX-A/e-AES).'),
C(3, 'Comment calculer le coût de revient DDP à l\'importation ?', 'CIF + droits de douane + autres taxes + TVA (si non récupérable) + frais d\'approche, de transit et de livraison. Base TVA = CIF + droits + autres taxes.'),
/* Pilier 4 */
C(4, 'Quelles sont les conditions de la force majeure en droit français ?', 'Art. 1218 C. civ. : événement échappant au contrôle du débiteur, imprévisible à la conclusion du contrat, dont les effets ne peuvent être évités par des mesures appropriées.'),
C(4, 'Quelle différence entre force majeure et hardship ?', 'Force majeure : impossibilité d\'exécuter. Hardship (imprévision) : exécution possible mais excessivement onéreuse, d\'où renégociation (art. 1195 C. civ.).'),
C(4, 'Quels sont les taux et indemnités de retard de paiement en France (B2B) ?', 'Taux au moins égal à 3 fois le taux d\'intérêt légal, plus indemnité forfaitaire de recouvrement de 40 € (L441-10 C. com.). Délai maximal : 60 jours date de facture ou 45 jours fin de mois.'),
C(4, 'Qu\'est-ce que la CVIM et quand s\'applique-t-elle ?', 'Convention de Vienne de 1980 sur la vente internationale de marchandises ; s\'applique automatiquement entre États contractants, sauf exclusion expresse par les parties.'),
C(4, 'Les Incoterms désignent-ils le droit applicable ?', 'Non. Il faut prévoir une clause de loi applicable (Rome I dans l\'UE) et de juridiction/arbitrage.'),
C(4, 'Quels sont les atouts de l\'arbitrage CCI ?', 'Neutralité, confidentialité, expertise des arbitres, exécution internationale par la Convention de New York (1958) dans plus de 170 États.'),
C(4, 'Quel est le rôle de l\'OHADA pour une entreprise ivoirienne ?', 'Droit des affaires uniforme dans 17 États : Actes uniformes (droit commercial général, sûretés, procédures collectives, arbitrage) ; CCJA comme juridiction commune.'),
C(4, 'Comment sont notés les pays par Coface ?', 'Échelle de A1 (très faible risque) à E (risque extrême) : A1, A2, A3, A4, B, C, D, E.'),
C(4, 'Que couvre une assurance-crédit export ?', 'Les risques commerciaux (insolvabilité, défaut) et politiques (transfert, guerre, expropriation) ; quotité souvent de 80 à 90 %.'),
C(4, 'Qu\'est-ce qu\'une clause de réserve de propriété ?', 'Le vendeur reste propriétaire jusqu\'au paiement intégral du prix. Elle doit être écrite et acceptée avant la livraison ; sa validité à l\'étranger dépend du droit local.'),
/* Pilier 5 */
C(5, 'Quelle est la première étape d\'un projet d\'export ?', 'L\'étude de marché et le ciblage, avec vérification de la réglementation (licences, normes, sanctions, droits de douane).'),
C(5, 'Qu\'est-ce que l\'EORI ?', 'Numéro d\'enregistrement et d\'identification des opérateurs économiques, obligatoire dans l\'UE pour les déclarations en douane.'),
C(5, 'À quoi sert la facture pro forma ?', 'C\'est une offre de prix, non comptable, utilisée pour le devis, l\'ouverture d\'un crédoc, une licence ou un transfert de devises.'),
C(5, 'Que contient la liste de colisage (packing list) ?', 'Le détail de chaque colis : contenu, nombre, poids brut/net, dimensions, marquage.'),
C(5, 'Comment se construit un prix export ?', 'Prix de revient + marge = EXW ; + emballage, pré-acheminement, douane export = FCA ; + fret = CPT ; + assurance = CIP ; + frais financiers et risques ; + droits/taxes = DDP.'),
C(5, 'Que sont les clauses (A), (B) et (C) de l\'assurance transport ?', 'Institute Cargo Clauses : (A) tous risques, (B) risques nommés étendus, (C) risques nommés minimum. Montant usuel : 110 % de la valeur CIF.'),
C(5, 'Quelle norme concerne les palettes en bois à l\'export ?', 'NIMP 15 (ISPM 15) : traitement phytosanitaire et marquage obligatoires.'),
C(5, 'Qu\'est-ce que l\'inspection avant expédition ?', 'Contrôle de qualité, quantité et prix par une société indépendante (SGS, Bureau Veritas, Cotecna), exigé par certains pays ou par l\'acheteur.'),
C(5, 'Quel document prouve la sortie d\'une marchandise du territoire de l\'UE ?', 'Le message de sortie de la déclaration d\'exportation (EX-A/e-AES, ex-EAD), indispensable pour justifier l\'exonération de TVA.'),
/* Compléments */
C(3, 'Que sont les THC ?', 'Terminal Handling Charges : frais de manutention au terminal portuaire, facturés au chargement et au déchargement. À répartir expressément dans le contrat de vente (qui paie au départ, qui paie à l\'arrivée).'),
C(3, 'Quelles sont les capacités indicatives des conteneurs maritimes standards ?', '20\' ≈ 33 m³ (≈ 28 t de charge utile) ; 40\' ≈ 67 m³ ; 40\' High Cube ≈ 76 m³ (valeurs indicatives, variables selon l\'armateur).'),
C(3, 'Que signifient FCL et LCL ?', 'FCL (Full Container Load) : conteneur complet pour un seul chargeur, tarif forfaitaire. LCL (Less than Container Load) : groupage, facturé au W/M.'),
C(5, 'Quel est le rôle d\'un transitaire (commissionnaire de transport) ?', 'Intermédiaire qui organise pour le compte de son client le transport, l\'assurance, le dédouanement et les formalités (freight forwarder).'),
C(3, 'Différence entre demurrage et detention ?', 'Demurrage (surestaries) : frais dus quand le conteneur reste au terminal au-delà du temps libre. Detention : frais d\'immobilisation du conteneur hors terminal au-delà du délai de restitution.'),
C(3, 'Que sont les DTS et pourquoi sont-ils utilisés dans le transport ?', 'Droits de tirage spéciaux (FMI) : unité de compte servant à plafonner la responsabilité du transporteur (ex. CMR : 8,33 DTS par kg de poids brut manquant ou avarié).'),
C(1, 'Sous FAS, quand le risque est-il transféré à l\'acheteur ?', 'Lorsque la marchandise est placée le long du navire désigné (sur le quai ou une barge) au port d\'embarquement convenu.'),
C(2, 'Quel principe gouverne l\'examen des documents en crédoc et à quoi servent les ISBP ?', 'Conformité stricte apparente des documents aux termes du crédit, des RUU et de la pratique bancaire. Les ISBP (CCI) sont le guide d\'examen des documents utilisé par les banques.'),
C(2, 'Différence entre lettre de change (traite), billet à ordre et aval ?', 'Traite : ordre de payer donné par le tireur (exportateur) au tiré (acheteur). Billet à ordre : promesse de payer du souscripteur. Aval : engagement d\'un tiers (souvent une banque) de garantir le paiement de l\'effet.'),
C(3, 'Qu\'est-ce que le statut OEA (Opérateur Économique Agréé) ?', 'Statut de confiance délivré par la douane (sûreté/sécurité, simplifications douanières), reconnu dans l\'UE et dans des accords de reconnaissance mutuelle avec des pays tiers.'),
C(5, 'Qu\'est-ce que le « cut-off » ?', 'La date et l\'heure limites de remise du conteneur ou du colis au terminal ou à la compagnie pour partir sur le navire ou le vol prévu.')
].map((c, i) => Object.assign({ id: 'b' + i }, c));

/* ---- 3c. QCM ET CAS PRATIQUES : Q(pilier, question, options, indexBonneRéponse, explication) ---- */
const Q = (p, q, o, a, e) => ({ p, q, o, a, e });
const CAS = (p, t, q, o, a, e) => ({ p, cas: true, t, q, o, a, e });
const QS = [
Q(1, 'Quelle règle Incoterms 2020 est réservée au transport maritime et fluvial ?', ['CPT', 'FOB', 'DAP', 'FCA'], 1, 'FOB, FAS, CFR et CIF sont les seules règles exclusivement maritimes et fluviales.'),
Q(1, 'Quelle règle a remplacé DAT dans Incoterms 2020 ?', ['DAP', 'DDP', 'DPU', 'CIP'], 2, 'DPU (Delivered at Place Unloaded) : livraison au lieu convenu, marchandise déchargée.'),
Q(1, 'Quelle assurance minimale sous CIP (Incoterms 2020) ?', ['Clause (C)', 'Clause (B)', 'Clause (A) « tous risques »', 'Aucune assurance'], 2, 'CIP exige la clause (A) ; CIF reste en clause (C). Montant minimal : 110 % du prix.'),
Q(1, 'Sous DDP, qui s\'acquitte des droits de douane à l\'importation ?', ['L\'acheteur', 'Le vendeur', 'Le transporteur', 'La banque'], 1, 'DDP : le vendeur dédouane à l\'import et paie droits et taxes ; c\'est la règle la plus lourde pour lui.'),
Q(1, 'Sous FCA, le risque est transféré :', ['À bord du navire', 'À la remise au transporteur désigné', 'À destination', 'Au paiement'], 1, 'FCA : transfert à la remise de la marchandise au transporteur (ou au chargement sur le véhicule de l\'acheteur si livraison chez le vendeur).'),
Q(1, 'Sous DAP, qui décharge la marchandise à destination ?', ['Le vendeur', 'L\'acheteur', 'Le transporteur maritime obligatoirement', 'La douane'], 1, 'DAP : marchandise prête au déchargement ; le déchargement est à la charge de l\'acheteur. DPU : à la charge du vendeur.'),
Q(1, 'Quelle affirmation sur les Incoterms est exacte ?', ['Ils règlent le transfert de propriété', 'Ils désignent la loi applicable', 'Ils répartissent coûts, risques et formalités', 'Ils fixent le mode de paiement'], 2, 'Les Incoterms répartissent coûts, risques et formalités ; propriété, paiement et droit applicable sont hors champ.'),
Q(2, 'Quel est le délai maximal d\'examen des documents par la banque (RUU 600) ?', ['2 jours ouvrés', '5 jours ouvrés bancaires', '10 jours calendaires', '21 jours'], 1, 'Art. 14 : 5 jours ouvrés bancaires suivant la présentation. 21 jours est le délai de présentation après expédition.'),
Q(2, 'Un crédoc irrévocable confirmé protège surtout l\'exportateur contre :', ['Le risque de change', 'Le risque de la banque émettrice et le risque pays', 'Le risque de qualité de la marchandise', 'Le risque de transport'], 1, 'La confirmation ajoute l\'engagement d\'une 2e banque (souvent locale), couvrant banque émettrice et risque pays.'),
Q(2, 'Dans une remise documentaire D/P, l\'acheteur reçoit les documents :', ['Contre paiement', 'Contre acceptation d\'une traite', 'Avant l\'expédition', 'Gratuitement'], 0, 'D/P : documents contre paiement. D/A : contre acceptation d\'une traite.'),
Q(2, 'Les URDG 758 régissent :', ['Les crédits documentaires', 'Les garanties sur demande', 'Les remises documentaires', 'Les Incoterms'], 1, 'URDG 758 : Règles uniformes pour les garanties sur demande.'),
Q(2, 'Quel message SWIFT correspond à l\'émission d\'un crédit documentaire ?', ['MT103', 'MT202', 'MT700', 'MT760'], 2, 'MT700 = émission de crédoc ; MT103 = virement client ; MT202 = interbancaire ; MT760 = garantie.'),
Q(2, 'Un exportateur facture en USD et craint la baisse du dollar. La couverture adaptée est :', ['Acheter des USD à terme', 'Vendre des USD à terme', 'Ne rien faire', 'Payer ses fournisseurs en USD uniquement'], 1, 'Il recevra des USD : il les vend à terme pour fixer le cours de conversion.'),
Q(2, 'Le forfaiting est :', ['Un rachat sans recours de créances à moyen terme', 'Une assurance-crédit', 'Un virement SWIFT', 'Un crédit documentaire'], 0, 'Le forfaiteur rachète sans recours des créances (effets avalisés, lettres de crédit), transférant les risques.'),
Q(3, 'Un colis de 120×80×100 cm pèse 90 kg en aérien. Quel est le poids taxable ? (1 t = 6 m³)', ['90 kg', '160 kg', '96 kg', '576 kg'], 1, '960 000 cm³ ÷ 6 000 = 160 kg volumétriques, supérieurs au poids réel de 90 kg.'),
Q(3, 'En maritime LCL, 4 m³ pour 3,2 t. Combien d\'unités payantes (W/M, 1 t = 1 m³) ?', ['3,2', '4', '7,2', '0,8'], 1, 'On retient la plus grande valeur entre 3,2 t et 4 m³ : 4 unités payantes.'),
Q(3, 'Quel document de transport est un titre négociable ?', ['CMR', 'LTA / AWB', 'Connaissement (B/L)', 'Facture pro forma'], 2, 'Le B/L à ordre est un titre représentatif de la marchandise ; CMR et LTA ne sont pas négociables.'),
Q(3, 'La CMR est la convention applicable au transport :', ['Maritime', 'Aérien', 'Routier international', 'Ferroviaire'], 2, 'CMR : Convention de Genève (1956) sur le contrat de transport routier de marchandises.'),
Q(3, 'La partie commune mondiale du code SH comporte :', ['4 chiffres', '6 chiffres', '8 chiffres', '10 chiffres'], 1, '6 chiffres communs ; 8 = NC (UE) ; 10 = TARIC.'),
Q(3, 'FOB 10 000 €, fret 1 500 €, assurance 100 € : valeur CIF ?', ['10 000 €', '11 500 €', '11 600 €', '11 400 €'], 2, 'CIF = FOB + fret + assurance = 11 600 €.'),
Q(3, 'CIF 10 000 €, droit de douane 10 %, TVA 18 % : montant de TVA ?', ['1 800 €', '1 980 €', '2 080 €', '1 100 €'], 1, 'Base TVA = 10 000 + 1 000 = 11 000 ; TVA = 11 000 × 18 % = 1 980 €.'),
Q(3, 'Quel régime permet d\'importer des matières pour les transformer et les réexporter ?', ['Transit', 'Perfectionnement actif', 'Entrepôt douanier', 'Mise à la consommation'], 1, 'Le perfectionnement actif suspend droits et TVA pour des produits transformés puis réexportés.'),
Q(3, 'Le certificat EUR.1 prouve :', ['La qualité du produit', 'L\'origine préférentielle', 'Le paiement des droits', 'La sortie du territoire'], 1, 'L\'EUR.1 atteste l\'origine préférentielle dans le cadre d\'accords commerciaux.'),
Q(3, 'L\'exportation de marchandises hors UE est, pour la TVA :', ['Taxée à 20 %', 'Exonérée sous réserve de la preuve de sortie', 'Toujours soumise à autoliquidation', 'Taxée à 5,5 %'], 1, 'Exonération de TVA à l\'export (art. 262 I CGI) avec justificatif de sortie.'),
Q(4, 'Quelle est la caractéristique de la force majeure (art. 1218 C. civ.) ?', ['Difficulté économique', 'Événement hors contrôle, imprévisible et insurmontable', 'Simple retard du fournisseur', 'Hausse des prix'], 1, 'Les trois critères : extérieur, imprévisible, irrésistible. Les difficultés économiques relèvent plutôt du hardship.'),
Q(4, 'Le hardship permet principalement :', ['De suspendre l\'exécution définitivement', 'De renégocier un contrat devenu excessivement onéreux', 'De changer de juridiction', 'De refuser tout paiement'], 1, 'Hardship = difficulté excessive → obligation de renégocier (art. 1195 C. civ., clause CCI).'),
Q(4, 'La CVIM (Vienne 1980) s\'applique à un contrat de vente internationale :', ['Seulement si les parties la choisissent', 'Automatiquement entre États contractants, sauf exclusion', 'Jamais pour les marchandises', 'Uniquement pour les services'], 1, 'Elle s\'applique par défaut entre États contractants (art. 1) sauf exclusion expresse (art. 6).'),
Q(4, 'Les sentences arbitrales CCI sont exécutables grâce à :', ['L\'URDG 758', 'La Convention de New York de 1958', 'Les RUU 600', 'Rome I'], 1, 'La Convention de New York facilite la reconnaissance des sentences dans plus de 170 États.'),
Q(4, 'La note Coface la plus favorable est :', ['E', 'D', 'A1', 'B'], 2, 'A1 = risque très faible ; E = extrême.'),
Q(4, 'Les pénalités de retard B2B en France sont d\'au moins :', ['1 fois le taux légal', '3 fois le taux d\'intérêt légal', '10 %', '0 %'], 1, 'Art. L441-10 C. com. : au moins 3 fois le taux d\'intérêt légal + indemnité forfaitaire de 40 €.'),

/* ----------------------- 4. MOTEUR D'ACTIVITÉ / STREAK ----------------------- */
function activity(fn) {
  const d = todayStr();
  const day = S.days[d] || (S.days[d] = { cards: 0, cases: 0, qcm: 0, ok: 0, tot: 0, read: false });
  fn(day);
  if (S.lastDate !== d) {                               // première activité du jour
    S.streak = (S.lastDate === addDays(d, -1)) ? S.streak + 1 : 1;
    S.lastDate = d;
    S.best = Math.max(S.best || 0, S.streak);
  }
  save();
}
function currentStreak() { const d = todayStr(); return (S.lastDate === d || S.lastDate === addDays(d, -1)) ? S.streak : 0; }
const dayData = d => S.days[d] || { cards: 0, cases: 0, qcm: 0, ok: 0, tot: 0, read: false };

/* ---- Cartes (originales + personnalisées) ---- */
function allCards() {
  const base = CARDS.filter(c => !S.hidden.includes(c.id)).map(c => Object.assign({}, c, S.edits[c.id] || {}));
  return base.concat(S.custom);
}
const SCORE = { 1: 0, 2: 0.35, 3: 0.75, 4: 1 };
function masteryOf(p) {
  const cs = allCards().filter(c => c.p == p);
  const cardM = cs.length ? cs.reduce((a, c) => a + (S.cards[c.id] ? SCORE[S.cards[c.id].last] || 0 : 0), 0) / cs.length : 0;
  const qs = S.qstats[p];
  if (qs && qs.tot >= 3) return Math.round((0.7 * cardM + 0.3 * (qs.ok / qs.tot)) * 100);
  return Math.round(cardM * 100);
}
const dueCount = () => { const t = todayStr(); return allCards().filter(c => { const s = S.cards[c.id]; return !s || s.due <= t; }).length; };

/* --------------------------- L. STATS FINES PAR SOUS-THÈME --------------------------- */
/* Les 55 questions QS()/CAS() ne portent pas de tag de sous-thème explicite : on les classe par
   mots-clés détectés dans leur texte, pour obtenir une maîtrise par sous-thème sans devoir
   réécrire chaque entrée. Catégories volontairement simples et couvrantes (fallback "Général"). */
const SUBTOPICS = {
  1: [ // Incoterms
    { k: 'c', n: 'Groupe C (CPT/CIP/CFR/CIF)', re: /\bCPT\b|\bCIP\b|\bCFR\b|\bCIF\b/ },
    { k: 'd', n: 'Groupe D (DAP/DPU/DDP)', re: /\bDAP\b|\bDPU\b|\bDDP\b/ },
    { k: 'ef', n: 'Groupe E/F (EXW/FCA/FAS/FOB)', re: /\bEXW\b|\bFCA\b|\bFAS\b|\bFOB\b/ }
  ],
  2: [
    { k: 'lc', n: 'Crédit documentaire', re: /cr[ée]dit documentaire|cr[ée]doc|RUU ?600|MT ?700|ISBP|banque [ée]mettrice|banque confirmat/i },
    { k: 'rd', n: 'Remise documentaire & traites', re: /remise documentaire|D\/P|D\/A|tir[ée]|tireur|traite/i },
    { k: 'risk', n: 'Risques & couverture', re: /risque pays|coface|forfaiting|assurance.cr[ée]dit|couverture|terme/i }
  ],
  3: [
    { k: 'calc', n: 'Calculs (poids, CIF, TVA)', re: /poids taxable|volum[ée]trique|\bCIF\b|TVA|W\/M|unit[ée]s? payantes?/i },
    { k: 'doc', n: 'Documents de transport', re: /\bCMR\b|\bB\/L\b|connaissement|\bLTA\b|\bAWB\b/i },
    { k: 'reg', n: 'Régimes douaniers & statuts', re: /perfectionnement|entrepôt douanier|\bOEA\b|code SH|EUR\.1|r[ée]gime/i },
    { k: 'inc', n: 'Incidents transport', re: /surestarie|demurrage|d[ée]tention/i }
  ],
  4: [
    { k: 'fm', n: 'Force majeure & hardship', re: /force majeure|hardship|imprévision/i },
    { k: 'dr', n: 'Droit applicable & arbitrage', re: /CVIM|Vienne|arbitral|arbitrage|New York/i },
    { k: 'pay', n: 'Paiement & pénalités', re: /p[ée]nalit[ée]s? de retard|coface|délai de paiement/i }
  ],
  5: [
    { k: 'form', n: 'Formalités export', re: /EORI|licence|[ée]tude de march[ée]/i },
    { k: 'docs', n: 'Documents & assurance', re: /pro forma|clause \(A\)|clause \(B\)|clause \(C\)|NIMP/i },
    { k: 'log', n: 'Transport & délais', re: /cut.off/i }
  ]
};
function classifySub(p, text) {
  const subs = SUBTOPICS[p] || [];
  for (const s of subs) if (s.re.test(text)) return s.k;
  return 'gen';
}
function subName(p, k) {
  if (k === 'gen') return 'Général';
  const s = (SUBTOPICS[p] || []).find(x => x.k === k);
  return s ? s.n : 'Général';
}
function recordSubStat(p, text, ok) {
  S.subqstats = S.subqstats || {};
  const sub = classifySub(p, text);
  const key = p + ':' + sub;
  const e = S.subqstats[key] || (S.subqstats[key] = { p, sub, ok: 0, tot: 0 });
  e.tot++; if (ok) e.ok++;
}
function subStatsFor(p) {
  S.subqstats = S.subqstats || {};
  const keys = (SUBTOPICS[p] || []).map(s => s.k).concat('gen');
  return keys.map(k => {
    const e = S.subqstats[p + ':' + k];
    return { k, n: subName(p, k), ok: e ? e.ok : 0, tot: e ? e.tot : 0 };
  }).filter(r => r.tot > 0);
}
function subStatsHtml(p) {
  const rows = subStatsFor(p);
  if (!rows.length) return `<p class="text-xs text-slate-500 mt-2">Pas encore assez de QCM répondus sur ce pilier pour un détail par sous-thème.</p>`;
  return `<div class="space-y-2 mt-2">${rows.map(r => { const pct = Math.round(r.ok / r.tot * 100); return `<div><div class="flex justify-between text-[11px]"><span>${esc(r.n)}</span><span>${r.ok}/${r.tot} (${pct} %)</span></div>${bar(pct, pct >= 70 ? '#10b981' : pct >= 40 ? '#f59e0b' : '#f43f5e')}</div>`; }).join('')}</div>`;
}

function fichedujour() { const d = new Date(); const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5); return ENC[doy % ENC.length]; }
function renderDash() {
  const t = todayStr(), td = dayData(t), g = S.goal, fj = fichedujour();
  const cardsPct = Math.round(td.cards / g.cards * 100), casesPct = Math.round(td.cases / g.cases * 100);
  const tile = (ico, label, val, sub) => `<div class="card"><div class="text-2xl">${ico}</div><div class="text-3xl font-bold mt-1">${val}</div><div class="text-sm font-medium">${label}</div><div class="text-xs text-slate-500">${sub}</div></div>`;
  const totalMastery = Math.round([1, 2, 3, 4, 5].reduce((a, p) => a + masteryOf(p), 0) / 5);
  // Calendrier des 30 derniers jours (colonnes = jours de la semaine, lundi en premier)
  const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(t, -i));
  const lead = (new Date(days[0] + 'T12:00:00').getDay() + 6) % 7;
  const lvl = d => { const x = dayData(d); const s = x.cards + x.qcm * 2 + x.cases * 5 + (x.read ? 2 : 0); return s === 0 ? 0 : s < 5 ? 1 : s < 15 ? 2 : s < 30 ? 3 : 4; };
  const colors = ['bg-slate-200 dark:bg-slate-800', 'bg-indigo-200 dark:bg-indigo-900', 'bg-indigo-400 dark:bg-indigo-700', 'bg-indigo-500', 'bg-indigo-700 dark:bg-indigo-400'];

/* ============================== ENCYCLOPÉDIE ============================== */
const ENCS = { q: '', p: 'all', open: null };
function hl(html, q) {
  const terms = q.trim().split(/\s+/).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return html;
  const re = new RegExp('(' + terms.join('|') + ')', 'gi');
  return html.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(re, '<mark class="bg-yellow-300/70 text-inherit rounded px-0.5">$1</mark>') + '<');
}
const textOf = h => h.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ');
function renderEnc() {
  $('#view').innerHTML = `<div class="fade">${head('Encyclopédie & Fiches de référence', `${ENC.length} fiches sur 5 piliers — recherche plein texte instantanée.`)}
  <input id="encQ" class="inp mb-3" aria-label="Rechercher dans l'encyclopédie" placeholder="Rechercher : crédoc, B/L, force majeure, DDP, TVA…" value="${esc(ENCS.q)}" oninput="ENCS.q=this.value;encList()">
  <div class="flex flex-wrap items-center gap-2 mb-2" id="encChips"></div>
  <div class="flex items-center justify-between mb-4 no-print"><div id="encCount" class="text-xs text-slate-500"></div><div class="flex gap-2"><button class="chip" onclick="encToggle(true)">Tout déplier</button><button class="chip" onclick="encToggle(false)">Tout replier</button><button class="chip" onclick="encToggle(true);window.print()">🖨️ Imprimer</button></div></div><div id="encRes"></div></div>`;
  encList();
}
function encList() {
  $('#encChips').innerHTML = [['all', 'Tous']].concat([1, 2, 3, 4, 5].map(p => [p, PN[p].short])).map(([p, l]) => `<button class="chip ${ENCS.p == p ? 'on' : ''}" onclick="ENCS.p='${p}';encList()">${l}</button>`).join('');
  const terms = norm(ENCS.q).split(/\s+/).filter(Boolean);
  let rows = ENC.filter(a => ENCS.p === 'all' || a.p == ENCS.p).map(a => {
    const tn = norm(a.t), bn = norm(textOf(a.h)); let score = 0, ok = true;
    for (const t of terms) { const inT = tn.includes(t), cnt = bn.split(t).length - 1; if (!inT && !cnt) { ok = false; break; } score += (inT ? 10 : 0) + cnt; }
    return { a, score, ok };
  }).filter(r => r.ok);
  if (terms.length) rows.sort((x, y) => y.score - x.score);
  $('#encCount').textContent = rows.length + ' fiche' + (rows.length > 1 ? 's' : '') + (terms.length ? ' trouvée' + (rows.length > 1 ? 's' : '') : '');
  $('#encRes').innerHTML = rows.length ? rows.map(({ a }) => `<details id="art-${a.id}" class="card mb-3 !p-0 overflow-hidden" ${(ENCS.open === a.id || terms.length) ? 'open' : ''}>
    <summary class="flex items-center gap-3 p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50"><span>${pBadge(a.p)}</span><span class="font-semibold flex-1">${hl(esc(a.t), ENCS.q)}</span><span class="text-slate-400">▾</span></summary>
    <div class="doc px-5 pb-5 pt-1">${hl(a.h, ENCS.q)}</div></details>`).join('') : '<div class="card text-center text-slate-500">Aucune fiche ne correspond à votre recherche.</div>';
}

function encToggle(open) { document.querySelectorAll('#encRes details').forEach(d => d.open = open); }

/* =============================== FLASHCARDS =============================== */
let FC = null;                                   // session en cours
const FCP = { tab: 'study', typing: true, p: 'all', mode: 'due', n: 20 };   // préférences de l'interface
function renderFlash() {
  const tabs = `<div class="flex gap-2 mb-5"><button class="chip ${FCP.tab === 'study' ? 'on' : ''}" onclick="FCP.tab='study';renderFlash()">Réviser</button><button class="chip ${FCP.tab === 'edit' ? 'on' : ''}" onclick="FCP.tab='edit';renderFlash()">Éditeur de cartes</button></div>`;
