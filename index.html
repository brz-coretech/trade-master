  FCP.tab === 'study' ? (FC && FC.active ? fcCard() : fcSetup()) : fcEditor();
}
function fcSetup() {
  const all = allCards(), t = todayStr();
  const nDue = all.filter(c => { const s = S.cards[c.id]; return !s || s.due <= t; }).length;
  const nWeak = all.filter(c => S.cards[c.id] && S.cards[c.id].last <= 2).length;
  let summary = '';
  if (FC && FC.done) summary = `<div class="card mb-5 border-emerald-500/50"><h3 class="font-semibold">🎉 Session terminée</h3><p class="text-sm mt-1">${FC.total} cartes maîtrisées. Évaluations : À revoir ${FC.r[1]} · Difficile ${FC.r[2]} · Bon ${FC.r[3]} · Parfait ${FC.r[4]}.</p></div>`;
  $('#fcBody').innerHTML = `${summary}<div class="card max-w-2xl"><div class="grid sm:grid-cols-2 gap-4">
    <div><label class="lbl">Pilier</label><select id="fcP" class="inp"><option value="all">Tous les piliers</option>${[1, 2, 3, 4, 5].map(p => `<option value="${p}" ${FCP.p == p ? 'selected' : ''}>${PN[p].n}</option>`).join('')}</select></div>
    <div><label class="lbl">Sélection</label><select id="fcMode" class="inp"><option value="due" ${FCP.mode === 'due' ? 'selected' : ''}>À réviser aujourd'hui (${nDue})</option><option value="weak" ${FCP.mode === 'weak' ? 'selected' : ''}>Cartes difficiles (${nWeak})</option><option value="all" ${FCP.mode === 'all' ? 'selected' : ''}>Toutes (${all.length})</option></select></div>
    <div><label class="lbl">Nombre de cartes</label><input id="fcN" type="number" min="1" max="200" class="inp" value="${FCP.n}"></div>
    <div class="flex items-end"><label class="flex items-center gap-2 text-sm"><input id="fcType" type="checkbox" ${FCP.typing ? 'checked' : ''}> Saisir ma réponse avant correction (anti-devinette)</label></div></div>
    <button class="btn btn-p mt-5" onclick="fcStart()">▶ Démarrer la session</button>
    <p class="text-xs text-slate-500 mt-4">Évaluations : À revoir (1 j) · Difficile (3 j) · Bon (7 j) · Parfait (14 j). Les cartes « À revoir » et « Difficile » sont réinjectées dans la session jusqu'à validation.</p></div>`;
}
function fcStart() {
  FCP.p = $('#fcP').value; FCP.mode = $('#fcMode').value; FCP.n = Math.max(1, +$('#fcN').value || 20); FCP.typing = $('#fcType').checked;
  const t = todayStr();
  let pool = allCards().filter(c => FCP.p === 'all' || c.p == FCP.p);
  if (FCP.mode === 'due') pool = pool.filter(c => { const s = S.cards[c.id]; return !s || s.due <= t; });
  else if (FCP.mode === 'weak') pool = pool.filter(c => S.cards[c.id] && S.cards[c.id].last <= 2);
  shuffle(pool); pool = pool.slice(0, FCP.n);
  if (!pool.length) { toast('Aucune carte pour cette sélection.'); return; }
  FC = { active: true, queue: pool.map(c => c.id), total: pool.length, seen: new Set(), failed: new Set(), rev: false, typed: '', gaveUp: false, r: { 1: 0, 2: 0, 3: 0, 4: 0 } };
  renderFlash();
}
const cardById = id => allCards().find(c => c.id === id);
function fcCard() {
  const id = FC.queue[0], c = cardById(id);
  if (!c) { FC.queue.shift(); return FC.queue.length ? fcCard() : fcEnd(); }
  const left = FC.total - FC.seen.size + (FC.queue.length - (FC.total - FC.seen.size)), pct = Math.round((FC.total - FC.queue.length) / FC.total * 100);
  let body;
  if (!FC.rev) {
    body = FCP.typing ? `<label class="lbl mt-5">Votre réponse (rappel actif)</label><textarea id="fcTxt" rows="4" class="inp" placeholder="Écrivez ce que vous savez, de mémoire…" oninput="FC.typed=this.value;$('#fcShow').disabled=!this.value.trim()">${esc(FC.typed)}</textarea>
      <div class="flex flex-wrap gap-2 mt-3"><button id="fcShow" class="btn btn-p" ${FC.typed.trim() ? '' : 'disabled'} onclick="fcReveal(false)">Révéler la correction</button><button class="btn" onclick="fcReveal(true)">Je sèche (limite la note à « À revoir »)</button></div>`
      : `<div class="mt-5"><p class="text-sm text-slate-500 mb-3">Formulez mentalement votre réponse complète, puis révélez.</p><button class="btn btn-p" onclick="fcReveal(false)">Révéler la réponse</button></div>`;
  } else {
    const kw = norm(c.a).split(/[^a-z0-9]+/).filter(w => w.length > 4), uniq = [...new Set(kw)], typedN = norm(FC.typed);
    const hit = uniq.filter(w => typedN.includes(w)).length, ov = uniq.length ? Math.round(hit / uniq.length * 100) : 0;
    const lock = FC.gaveUp;
    body = `<div class="grid md:grid-cols-2 gap-3 mt-5">
      ${FCP.typing ? `<div class="rounded-lg border border-slate-300 dark:border-slate-700 p-3"><div class="lbl">Votre réponse</div><div class="text-sm">${FC.typed.trim() ? nl2br(FC.typed) : '<i class="text-slate-400">— aucune —</i>'}</div>${FC.typed.trim() ? `<div class="text-[11px] text-slate-500 mt-2">Recouvrement de mots-clés (indicatif) : ${ov} %</div>` : ''}</div>` : ''}
      <div class="rounded-lg border border-emerald-500/50 bg-emerald-500/5 p-3 ${FCP.typing ? '' : 'md:col-span-2'}"><div class="lbl">Correction</div><div class="text-sm">${nl2br(c.a)}</div></div></div>
      <div class="mt-5 text-sm font-medium">Comment évaluez-vous votre rappel ? <span class="text-xs text-slate-500">(touches 1-4)</span></div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">
        <button class="btn btn-d" onclick="fcRate(1)">1 · À revoir<br><span class="text-[11px] opacity-80">1 jour</span></button>
        <button class="btn" ${''} onclick="fcRate(2)" style="border-color:#f59e0b">2 · Difficile<br><span class="text-[11px] opacity-80">3 jours</span></button>
        <button class="btn" ${lock ? 'disabled' : ''} onclick="fcRate(3)" style="border-color:#10b981">3 · Bon<br><span class="text-[11px] opacity-80">7 jours</span></button>
        <button class="btn btn-p" ${lock ? 'disabled' : ''} onclick="fcRate(4)">4 · Parfait<br><span class="text-[11px] opacity-80">14 jours</span></button></div>
      ${lock ? '<p class="text-xs text-amber-500 mt-2">Vous avez révélé sans répondre : seules les notes « À revoir » et « Difficile » sont disponibles.</p>' : ''}`;
  }
  $('#fcBody').innerHTML = `<div class="max-w-3xl"><div class="flex items-center gap-3 mb-3 text-xs text-slate-500"><div class="flex-1">${bar(pct, '#6366f1')}</div><span>${FC.queue.length} restante${FC.queue.length > 1 ? 's' : ''}</span><button class="underline" onclick="FC.active=false;renderFlash()">Quitter</button></div>
    <div class="card"><div class="flex items-center gap-2 mb-3">${pBadge(c.p)}${FC.failed.has(id) ? '<span class="text-[11px] text-amber-500">↻ réinjectée</span>' : ''}</div>
    <div class="text-lg font-semibold">${nl2br(c.q)}</div>${body}</div></div>`;
  const tx = $('#fcTxt'); if (tx && !FC.rev) tx.focus();
}
function fcReveal(giveUp) { FC.rev = true; FC.gaveUp = !!giveUp; if (giveUp) FC.typed = ''; fcCard(); }
function fcRate(r) {
  const id = FC.queue.shift(), days = [1, 3, 7, 14][r - 1];
  const st = S.cards[id] || { reps: 0, lapses: 0 };
  st.last = r; st.reps++; if (r === 1) st.lapses++;
  let d = days; if (r >= 3 && FC.failed.has(id)) d = Math.min(d, 3);      // carte ratée dans la session : revue rapprochée
  st.due = addDays(todayStr(), d); S.cards[id] = st; FC.r[r]++;
  if (!FC.seen.has(id)) { FC.seen.add(id); activity(x => x.cards++); addXp(r >= 3 ? 5 : 2, 'card'); } else save();
  if (r <= 2) { FC.failed.add(id); FC.queue.splice(Math.min(FC.queue.length, r === 1 ? 3 : 6), 0, id); }  // réinjection immédiate
  FC.rev = false; FC.typed = ''; FC.gaveUp = false; renderNav();
  FC.queue.length ? fcCard() : fcEnd();
}
function fcEnd() { FC.active = false; FC.done = true; renderNav(); renderFlash(); }
document.addEventListener('keydown', e => {
  if (CUR !== 'flash' || !FC || !FC.active || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (!FC.rev) { if (!FCP.typing && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); fcReveal(false); } return; }   // mode sans saisie : Espace/Entrée révèle
  if (['1', '2', '3', '4'].includes(e.key)) { const r = +e.key; if (FC.gaveUp && r > 2) return; fcRate(r); }
});

function edSave() {
  const p = +$('#edP').value, q = $('#edQ').value.trim(), a = $('#edA').value.trim();
  if (!q || !a) return toast('Question et réponse sont obligatoires.');
  if (FCE.editing) {
    const id = FCE.editing, i = S.custom.findIndex(c => c.id === id);
    if (i >= 0) S.custom[i] = Object.assign(S.custom[i], { p, q, a }); else S.edits[id] = { p, q, a };
    FCE.editing = null; toast('Carte modifiée.');
  } else { S.custom.push({ id: 'u' + (S.nextId++), p, q, a }); toast('Carte ajoutée.'); }

function edDel(id) {
  if (!confirm('Supprimer cette carte ?')) return;
  if (id[0] === 'u') S.custom = S.custom.filter(c => c.id !== id); else { S.hidden.push(id); delete S.edits[id]; }

}

function exStart() {
  ST.type = $('#stT').value; ST.p = $('#stP').value; ST.n = Math.max(1, +$('#stN').value || 10);
  let pool = QS.filter(q => (ST.p === 'all' || q.p == ST.p) && (ST.type === 'mixte' || (ST.type === 'cas' ? q.cas : !q.cas)));
  if (!pool.length) return toast('Aucune question pour cette sélection.');
  const n = Math.min(ST.n, pool.length);
  let unseen = pool.filter(q => !S.seenQ.includes(q.id));
  if (unseen.length < n) { S.seenQ = S.seenQ.filter(id => !pool.some(q => q.id === id)); unseen = pool.slice(); }   // cycle épuisé : on repart de zéro
  shuffle(unseen);
  let pick = unseen.slice(0, n);
  if (pick.length < n) pick = pick.concat(shuffle(pool.filter(q => !pick.includes(q))).slice(0, n - pick.length));
  const list = pick.map(q => ({ q, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))) }));   // options mélangées

function rankIndex(xp) { let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k].xp) i = k; return i; }
function rankInfo() {
  const xp = S.xp || 0, i = rankIndex(xp), cur = RANKS[i], next = RANKS[i + 1];
  const pct = next ? Math.round((xp - cur.xp) / (next.xp - cur.xp) * 100) : 100;

}

function renderNego() {
  S.flags = S.flags || {};
  $('#view').innerHTML = `<div class="fade">${head('Simulateur de négociation', 'Jeux de rôle à embranchements face à un partenaire étranger fictif — chaque choix est justifié pédagogiquement.')}
  <div class="grid md:grid-cols-2 gap-4">${NEGO_SCN.map(sc => {
    const prog = S.nego[sc.id] || {};
    return `<div class="card"><h3 class="font-semibold mb-1">${sc.titre}</h3><p class="text-xs text-slate-500 mb-3">${esc(sc.intro)}</p>
    <button class="btn btn-p" onclick="negoStart('${sc.id}')">${prog.done ? '🔁 Refaire le scénario' : '▶ Démarrer'}</button>
    ${prog.done ? `<span class="text-xs text-emerald-500 ml-2">✅ Terminé (${prog.score}/${sc.steps.length})</span>` : ''}</div>`;
  }).join('')}</div></div>`;
}
let NEGO = null;
function negoStart(id) { NEGO = { sc: NEGO_SCN.find(s => s.id === id), i: 0, score: 0, sel: null }; renderNegoStep(); }
function renderNegoStep() {
  const sc = NEGO.sc, st = sc.steps[NEGO.i], answered = NEGO.sel !== null;
  $('#view').innerHTML = `<div class="fade max-w-3xl">${head(sc.titre, `Étape ${NEGO.i + 1} / ${sc.steps.length}`)}
  ${NEGO.i === 0 ? `<div class="card mb-4 border-indigo-500/40 bg-indigo-500/5 text-sm">${esc(sc.intro)}</div>` : ''}
  <div class="card"><div class="font-medium mb-4">${esc(st.q)}</div><div class="space-y-2">
  ${st.opts.map((o, i) => {
    let cls = 'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800';
    if (answered) cls = o.ok ? 'border-emerald-500 bg-emerald-500/10' : (NEGO.sel === i ? 'border-rose-500 bg-rose-500/10' : 'border-slate-300 dark:border-slate-700 opacity-60');
    return `<button ${answered ? 'disabled' : ''} onclick="negoAnswer(${i})" class="w-full text-left rounded-lg border px-4 py-3 text-sm transition ${cls}">${esc(o.t)}</button>`;
  }).join('')}</div>
  ${answered ? `<div class="mt-4 rounded-lg p-3 text-sm ${st.opts[NEGO.sel].ok ? 'bg-emerald-500/10' : 'bg-rose-500/10'}"><b>${st.opts[NEGO.sel].ok ? '✅ Choix pertinent' : '⚠️ Choix risqué'}</b><p class="mt-1">${esc(st.opts[NEGO.sel].fb)}</p></div>
    <button class="btn btn-p mt-4" onclick="negoNext()">${NEGO.i + 1 < sc.steps.length ? 'Étape suivante →' : 'Voir le résultat'}</button>` : ''}</div>
  <button class="underline text-xs mt-4 text-slate-500" onclick="NEGO=null;renderNego()">Abandonner</button></div>`;
}
function negoAnswer(i) { NEGO.sel = i; if (NEGO.sc.steps[NEGO.i].opts[i].ok) NEGO.score++; renderNegoStep(); }
function negoNext() {
  NEGO.i++; NEGO.sel = null;
  if (NEGO.i >= NEGO.sc.steps.length) {
    S.nego[NEGO.sc.id] = { done: true, score: NEGO.score };
    addXp(15, 'negociation'); save();
    const sc = NEGO.sc, score = NEGO.score;
    NEGO = null;
    $('#view').innerHTML = `<div class="fade max-w-2xl">${head('Résultat de la négociation')}<div class="card border-indigo-500/50"><h3 class="font-semibold">Score : ${score} / ${sc.steps.length}</h3><p class="text-sm mt-2">+15 XP pour avoir mené ce scénario jusqu'au bout.</p>
    <button class="btn btn-p mt-4" onclick="go('nego')">Retour aux scénarios</button></div></div>`;
    renderNav(); return;
  }
  renderNegoStep();
}

      <p class="text-sm mt-3 text-slate-600 dark:text-slate-400"><b>À retenir :</b> un incident douanier déclenche souvent un effet domino (documents → délai du crédit → tension client). Traiter la cause documentaire sans perdre de vue les délais bancaires et la relation commerciale est la compétence clé de ce scénario.</p>

      <button class="btn btn-p mt-4" onclick="go('crisis')">Retour au scénario</button></div></div>`;
    renderNav(); return;
  }
  renderCrisisStep();
}
